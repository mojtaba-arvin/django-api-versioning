name: Mutation shard

on:
  workflow_call:
    inputs:
      target_id:
        description: Stable mutation target identifier.
        required: true
        type: string
      target_path:
        description: Python source path mutated by this shard.
        required: true
        type: string

permissions:
  contents: read

jobs:
  mutation:
    if: github.event_name != 'push'
    name: Mutation shard (${{ inputs.target_id }})
    runs-on: ubuntu-latest
    timeout-minutes: ${{ github.event_name == 'pull_request' && 30 || 60 }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-ci.txt
      - name: Restore target-specific mutation cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: |
            .mutmut-cache
            mutants
          key: mutmut-${{ runner.os }}-${{ inputs.target_id }}-${{ github.event_name }}-contexts-v4-all-nodeids-${{ hashFiles(inputs.target_path, 'tests/**/*.py', 'setup.cfg', 'mutmut_config.py', 'requirements-ci.txt') }}
      - name: Install test and mutation dependencies
        run: |
          python -m pip install -e . -r requirements-ci.txt "mutmut==2.5.1"
      - name: Scope mutation generation to this shard
        env:
          MUTATION_TARGET: ${{ inputs.target_path }}
        run: |
          python - <<'PY'
          import os
          import re
          from pathlib import Path

          config = Path("setup.cfg")
          source = config.read_text()
          updated, replacements = re.subn(
              r"(?m)^paths_to_mutate\s*=.*$",
              f"paths_to_mutate = {os.environ['MUTATION_TARGET']}",
              source,
          )
          if replacements != 1:
              raise SystemExit("Expected exactly one [mutmut] paths_to_mutate setting")

          depth = 4 if os.environ["GITHUB_EVENT_NAME"] == "pull_request" else 8
          updated, depth_replacements = re.subn(
              r"(?m)^max_stack_depth\s*=.*$",
              f"max_stack_depth = {depth}",
              updated,
          )
          if depth_replacements != 1:
              raise SystemExit("Expected exactly one [mutmut] max_stack_depth setting")
          config.write_text(updated)
          PY
      - name: Download shared mutation coverage data
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: mutation-coverage-data
          path: .
      - name: Restore coverage.py's expected data filename
        run: mv coverage.data .coverage
      - name: Run mutation analysis
        env:
          MUTATION_TARGET_ID: ${{ inputs.target_id }}
        shell: bash
        run: |
          set -euo pipefail
          if [ "$GITHUB_EVENT_NAME" = "pull_request" ]; then
            mutation_args=(--use-coverage)
          else
            mutation_args=(--use-coverage --rerun-all)
          fi
          if mutmut run "${mutation_args[@]}" > "$RUNNER_TEMP/mutmut-run.log" 2>&1; then
            mutation_status=0
          else
            mutation_status=$?
          fi
          tail -n 30 "$RUNNER_TEMP/mutmut-run.log"
          if [ "$mutation_status" -ne 0 ] && [ "$mutation_status" -ne 2 ]; then
            echo "Mutation runner failed with exit code $mutation_status" >&2
            exit "$mutation_status"
          fi

          if mutmut results > "$RUNNER_TEMP/${MUTATION_TARGET_ID}-results.txt"; then
            :
          else
            results_status=$?
            if [ "$results_status" -ne 2 ] || [ ! -s "$RUNNER_TEMP/${MUTATION_TARGET_ID}-results.txt" ]; then
              echo "Unable to collect mutmut's per-mutant report (exit $results_status)" >&2
              exit "$results_status"
            fi
          fi

          # Preserve exact survivor diffs and test contexts on every campaign.
          python scripts/export_mutation_report.py \
            --target "$MUTATION_TARGET_ID" \
            --cache .mutmut-cache \
            --coverage .coverage \
            --results "$RUNNER_TEMP/${MUTATION_TARGET_ID}-results.txt" \
            --run-log "$RUNNER_TEMP/mutmut-run.log" \
            --runner-exit "$mutation_status" \
            --summary "$RUNNER_TEMP/${MUTATION_TARGET_ID}.json" \
            --report "$RUNNER_TEMP/${MUTATION_TARGET_ID}-mutants.ndjson" \
            --details
      - name: Preserve shard diagnostics
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: mutmut-${{ inputs.target_id }}
          path: |
            ${{ runner.temp }}/${{ inputs.target_id }}.json
            ${{ runner.temp }}/mutmut-run.log
            ${{ runner.temp }}/${{ inputs.target_id }}-results.txt
            ${{ runner.temp }}/${{ inputs.target_id }}-mutants.ndjson
            .mutmut-cache
            mutants
          if-no-files-found: ignore
          include-hidden-files: true
          retention-days: 14
