name: Refresh release lockfile

on:
  push:
    branches:
      - release/v1.0.0
    paths:
      - "pyproject.toml"
      - ".github/workflows/refresh-release-lock.yml"

permissions:
  contents: read

concurrency:
  group: refresh-release-lock-${{ github.ref }}
  cancel-in-progress: true

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Check out release branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7

      - name: Regenerate lockfile with pinned uv
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = "refs/heads/release/v1.0.0"
          python -m pip install --disable-pip-version-check "uv==0.13.8"
          uv lock

      - name: Commit regenerated lockfile
        run: |
          set -euo pipefail
          if git diff --quiet -- uv.lock; then
            echo "uv.lock is already synchronized."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add uv.lock
          git commit -m "chore(deps): regenerate release uv lockfile"
          git push origin "HEAD:$GITHUB_REF_NAME"
