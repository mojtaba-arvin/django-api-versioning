name: Agent tooling

on:
  push:
    branches: [main, audit/comprehensive-package-review]
    paths:
      - "AGENTS.md"
      - "CLAUDE.md"
      - ".claude/skills/**"
      - ".agents/skills/**"
      - ".agents/evals/**"
      - ".github/copilot-instructions.md"
      - ".github/skills/**"
      - ".github/workflows/agent-tooling.yml"
      - "docs/agent-engineering.md"
      - "scripts/agent.py"
      - "scripts/agent_tests/**"
  pull_request:
    types: [opened, reopened, synchronize, ready_for_review]
    branches: [main]
    paths:
      - "AGENTS.md"
      - "CLAUDE.md"
      - ".claude/skills/**"
      - ".agents/skills/**"
      - ".agents/evals/**"
      - ".github/copilot-instructions.md"
      - ".github/skills/**"
      - ".github/workflows/agent-tooling.yml"
      - "docs/agent-engineering.md"
      - "scripts/agent.py"
      - "scripts/agent_tests/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: agent-tooling-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: "3.10"

      - name: Validate agent configuration and helper tests
        run: python scripts/agent.py verify

      - name: Validate workflow YAML
        run: |
          ruby -e 'require "yaml"; Dir.glob(".github/**/*.yml").sort.each { |file| YAML.safe_load_file(file, aliases: true); puts "valid YAML: #{file}" }'
