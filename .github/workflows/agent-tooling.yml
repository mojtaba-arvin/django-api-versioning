name: Agent tooling

on:
  workflow_call:
  push:
    branches: [main]
    paths:
      - "AGENTS.md"
      - "website/AGENTS.md"
      - "website/.agents/**"
      - "website/.claude/**"
      - "CLAUDE.md"
      - ".claude/skills/**"
      - ".agents/skills/**"
      - ".agents/evals/**"
      - ".github/copilot-instructions.md"
      - ".github/skills/**"
      - ".github/workflows/**"
      - ".claude/push.sh"
      - "docs/agent-engineering.md"
      - "requirements-dev.txt"
      - "scripts/agent.py"
      - "scripts/verify_repository_policy.py"
      - "scripts/configure_github_repository.sh"
      - "scripts/maintain.sh"
      - "scripts/release_tags.py"
      - "scripts/test_release_tags.py"
      - "scripts/classify_pr_changes.py"
      - "scripts/test_classify_pr_changes.py"
      - "scripts/agent_tests/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: agent-tooling-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: "3.10"

      - name: Validate agent configuration and helper tests
        run: python scripts/agent.py verify
      - name: Validate maintainer requirements file
        run: python -m pip install --dry-run --no-deps --disable-pip-version-check -r requirements-dev.txt
      - name: Enforce repository workflow policy
        run: python scripts/verify_repository_policy.py
      - name: Test pull-request path classification
        run: python -m unittest scripts.test_classify_pr_changes
      - name: Test release tag detection and safety
        run: python -m unittest scripts.test_release_tags
      - name: Validate shell helper syntax
        run: |
          while IFS= read -r -d '' script; do
            bash -n "$script"
          done < <(find scripts .claude -type f -name "*.sh" -print0)

      - name: Validate workflow YAML
        run: |
          ruby -e 'require "yaml"; Dir.glob(".github/**/*.yml").sort.each { |file| YAML.safe_load_file(file, aliases: true); puts "valid YAML: #{file}" }'
