name: OpenAPI contract integration

on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  versioned-openapi:
    name: Versioned OpenAPI consumer contract
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"

      - name: Install package and pinned schema tooling
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
          python -m pip install -r requirements-ci.txt
          python -m pip install \
            -r examples/openapi_contract/requirements.txt \
            -r examples/consumer_migration/requirements.txt

      - name: Run package tests with optional OpenAPI adapter coverage
        run: |
          python -m pytest tests --cov=django_api_versioning --cov-append
          python -m pytest integration_test_project --cov=django_api_versioning --cov-append \
            --cov-report=term-missing \
            --cov-report=xml:"$RUNNER_TEMP/package-coverage.xml"
          python -m coverage json --pretty-print -o "$RUNNER_TEMP/package-coverage.json"

      - name: Upload combined package coverage report
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: package-coverage-with-openapi
          path: |
            ${{ runner.temp }}/package-coverage.xml
            ${{ runner.temp }}/package-coverage.json
          if-no-files-found: error
          retention-days: 7

      - name: Enforce independent line and branch coverage thresholds
        run: python scripts/check_coverage_thresholds.py "$RUNNER_TEMP/package-coverage.json" --line-threshold 95 --branch-threshold 95

      - name: Print combined package coverage report
        run: python -m coverage report --show-missing --precision=2

      - name: Verify runtime routing and versioned OpenAPI schemas
        run: python examples/openapi_contract/verify.py

      - name: Export versioned OpenAPI schemas
        run: |
          python examples/openapi_contract/generate_schemas.py \
            --output-dir "$RUNNER_TEMP/openapi-contract-schemas"

      - name: Export V1/V2/V3 consumer migration schemas
        run: |
          python examples/consumer_migration/generate_schemas.py \
            --output-dir "$RUNNER_TEMP/openapi-contract-schemas/consumer-migration"

      - name: Upload generated OpenAPI schemas for review
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: versioned-openapi-contract-schemas
          path: ${{ runner.temp }}/openapi-contract-schemas/
          if-no-files-found: error
          retention-days: 7

      - name: Verify consumer migration runtime and schema assertions
        run: |
          python examples/consumer_migration/verify.py \
            --schema-dir "$RUNNER_TEMP/openapi-contract-schemas/consumer-migration"

      - name: Install pinned oasdiff
        run: |
          archive="$RUNNER_TEMP/oasdiff_1.38.0_linux_amd64.tar.gz"
          curl -fsSL \
            https://github.com/oasdiff/oasdiff/releases/download/v1.38.0/oasdiff_1.38.0_linux_amd64.tar.gz \
            -o "$archive"
          echo "613037fd6a1d3362a1b742d6d86c338c0eb5ab3511f4942ce3948e78720ea2da  $archive" | sha256sum --check
          mkdir -p "$RUNNER_TEMP/oasdiff"
          tar -xzf "$archive" -C "$RUNNER_TEMP/oasdiff"
          binary="$(find "$RUNNER_TEMP/oasdiff" -type f -name oasdiff -perm -u+x -print -quit)"
          test -n "$binary"
          sudo install "$binary" /usr/local/bin/oasdiff
          oasdiff --help >/dev/null

      - name: Verify semantic breaking-change detection
        run: |
          python examples/openapi_contract/verify_oasdiff.py \
            --oasdiff /usr/local/bin/oasdiff \
            --schema-dir "$RUNNER_TEMP/openapi-contract-schemas" \
            --migration-schema-dir "$RUNNER_TEMP/openapi-contract-schemas/consumer-migration"

      - name: Compare candidate schemas with committed version baselines
        run: |
          oasdiff breaking --fail-on WARN \
            examples/openapi_contract/schemas/v1/openapi.yaml \
            "$RUNNER_TEMP/openapi-contract-schemas/v1/openapi.yaml"
          oasdiff breaking --fail-on WARN \
            examples/openapi_contract/schemas/v2/openapi.yaml \
            "$RUNNER_TEMP/openapi-contract-schemas/v2/openapi.yaml"

  openapi-evidence:
    name: Record reusable OpenAPI consumer evidence
    needs: versioned-openapi
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check out the validated source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: "3.12"
      - name: Fingerprint OpenAPI contract inputs
        run: python scripts/quality_fingerprint.py --output "$RUNNER_TEMP/openapi-contract-evidence.json"
      - name: Publish reusable OpenAPI consumer evidence
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: openapi-contract-evidence
          path: ${{ runner.temp }}/openapi-contract-evidence.json
          if-no-files-found: error
          retention-days: 90
