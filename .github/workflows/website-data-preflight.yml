name: Website static build and distribution checks

on:
  workflow_call:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "website/**"
      - "docs/articles/**"
      - "django_api_versioning/**"
      - "tests/**"
      - "integration_test_project/**"
      - "pyproject.toml"
      - "pytest.ini"
      - "requirements-ci.txt"
      - "requirements.txt"
      - "scripts/verify_website_examples.py"
      - ".github/workflows/website-data-preflight.yml"

permissions:
  contents: read

concurrency:
  group: website-build-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: "3.12"
      - name: Install Python evidence dependencies
        run: |
          python -m pip install --disable-pip-version-check -r requirements-ci.txt
      - name: Verify package-backed website examples and generated evidence
        run: |
          python integration_test_project/segment_lab/generate_routes.py
          python scripts/verify_website_examples.py
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1  # v7.1.0
        with:
          node-version: "22.23.4"
      - name: Enable pinned pnpm
        run: |
          corepack enable
          corepack prepare pnpm@10.12.1 --activate
      - name: Regenerate pnpm lockfile for dependency PR validation
        if: github.event_name == 'pull_request'
        working-directory: website
        run: pnpm install --lockfile-only
      - name: Upload regenerated pnpm lockfile for review
        if: github.event_name == 'pull_request'
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: regenerated-pnpm-lock-${{ github.run_id }}
          path: website/pnpm-lock.yaml
          if-no-files-found: error
          retention-days: 1

      - name: Install locked dependencies
        working-directory: website
        run: pnpm install --frozen-lockfile
      - name: Validate build scripts and run unit/distribution tests
        working-directory: website
        run: |
          node --check scripts/sync-articles.mjs
          node --check scripts/sync-reference.mjs
          node --check scripts/check-dist.mjs
          node --check scripts/check-dist.test.mjs
          pnpm test
      - name: Type-check website
        working-directory: website
        run: pnpm typecheck
      - name: Build and verify root-hosted static artifact
        working-directory: website
        env:
          PUBLIC_BASE_PATH: /
          SITE_URL: https://example.invalid
        run: |
          pnpm build
          pnpm run test:dist:root
      - name: Build and verify GitHub Pages project-site artifact
        working-directory: website
        env:
          PUBLIC_BASE_PATH: /django-api-versioning
          SITE_URL: https://example.invalid
        run: |
          pnpm build
          pnpm run test:dist:subpath
