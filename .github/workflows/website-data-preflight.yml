name: Website build and static verification

on:
  # Run once when a PR enters review; use workflow_dispatch for later checkpoints.
  # Main remains automatically validated after relevant website/content changes.
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "website/**"
      - "!website/package.json"
      - "docs/articles/**"
  pull_request:
    types: [opened, reopened, ready_for_review]
    branches: [main]
    paths:
      - "website/**"
      - "!website/package.json"
      - "docs/articles/**"

permissions:
  contents: read

concurrency:
  group: website-build-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-node@v6
        with:
          node-version: "22.23.4"
          cache: npm
          cache-dependency-path: website/package-lock.json
      - name: Install locked dependencies
        working-directory: website
        run: npm ci
      - name: Audit locked dependencies
        working-directory: website
        run: npm audit --audit-level=high
      - name: Validate scripts and unit tests
        working-directory: website
        run: |
          node --check scripts/sync-articles.mjs
          node --check scripts/sync-evidence.mjs
          node --check scripts/check-dist.mjs
          node --check scripts/serve-dist.mjs
          npm test
      - name: Run Astro type and content checks
        working-directory: website
        run: npm run check
      - name: Build and inspect root-hosted artifact
        working-directory: website
        run: |
          npm run build
          npm run test:dist
      - name: Build and inspect GitHub Pages project-site artifact
        working-directory: website
        env:
          PUBLIC_BASE_PATH: /django-api-versioning
        run: |
          npm run build
          npm run test:dist
