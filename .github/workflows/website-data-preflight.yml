name: Website build and static verification

on:
  push:
    branches: [audit/comprehensive-package-review]
    paths:
      - ".github/workflows/website-data-preflight.yml"

permissions:
  contents: read

concurrency:
  group: website-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: "22.12.0"
          cache: npm
          cache-dependency-path: website/package-lock.json
      - name: Install locked dependencies
        working-directory: website
        run: npm ci
      - name: Validate scripts and unit tests
        working-directory: website
        run: |
          node --check scripts/sync-articles.mjs
          node --check scripts/sync-evidence.mjs
          node --check scripts/check-dist.mjs
          node --check scripts/serve-dist.mjs
          npm test
      - name: Run Astro type and content checks
        working-directory: website
        run: npm run check
      - name: Build and inspect root-hosted artifact
        working-directory: website
        run: |
          npm run build
          npm run test:dist
      - name: Build and inspect GitHub Pages project-site artifact
        working-directory: website
        env:
          PUBLIC_BASE_PATH: /django-api-versioning
        run: |
          npm run build
          npm run test:dist
