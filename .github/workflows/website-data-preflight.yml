name: Website build and static verification

on:
  # Run once when a PR enters review; use workflow_dispatch for later checkpoints.
  # Main and the active long-lived audit branch are validated after relevant
  # website/content changes; use workflow_dispatch for deliberate checkpoints.
  workflow_dispatch:
  push:
    branches: [main, audit/comprehensive-package-review]
    paths:
      - "website/**"
      - "docs/articles/**"
      - "!website/package.json"
      - "!website/package-lock.json"
      - ".github/workflows/website-data-preflight.yml"
  pull_request:
    types: [opened, reopened, synchronize, ready_for_review]
    branches: [main]
    paths:
      - "website/**"
      - "!website/package.json"
      - "docs/articles/**"
      - ".github/workflows/website-data-preflight.yml"

permissions:
  contents: read

concurrency:
  group: website-build-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1  # v7.1.0
        with:
          node-version: "22.23.4"
          cache: npm
          cache-dependency-path: website/package-lock.json
      - name: Install locked dependencies
        working-directory: website
        run: npm ci
      - name: Validate scripts and unit tests
        working-directory: website
        run: |
          node --check scripts/sync-articles.mjs
          node --check scripts/sync-evidence.mjs
          node --check scripts/check-dist.mjs
          node --check scripts/serve-dist.mjs
          npm test
      - name: Run Astro type and content checks
        working-directory: website
        run: npm run check
      - name: Build and inspect root-hosted artifact
        working-directory: website
        run: |
          npm run build
          npm run test:dist
      - name: Build and inspect GitHub Pages project-site artifact
        working-directory: website
        env:
          PUBLIC_BASE_PATH: /django-api-versioning
        run: |
          npm run build
          npm run test:dist
