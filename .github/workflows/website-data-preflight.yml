name: Website static build and distribution checks

on:
  workflow_call:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "website/**"
      - "docs/articles/**"
      - ".github/workflows/website-data-preflight.yml"

permissions:
  contents: read

concurrency:
  group: website-build-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38  # v6
        with:
          node-version: "22.23.4"
          cache: pnpm
          cache-dependency-path: website/pnpm-lock.yaml
      - name: Enable pinned pnpm
        run: |
          corepack enable
          corepack prepare pnpm@10.12.1 --activate
      - name: Install locked dependencies
        working-directory: website
        run: pnpm install --frozen-lockfile
      - name: Validate build scripts and run unit/distribution tests
        working-directory: website
        run: |
          node --check scripts/sync-articles.mjs
          node --check scripts/check-dist.mjs
          node --check scripts/check-dist.test.mjs
          pnpm test
      - name: Type-check website
        working-directory: website
        run: pnpm typecheck
      - name: Build and verify root-hosted static artifact
        working-directory: website
        env:
          PUBLIC_BASE_PATH: /
          SITE_URL: https://example.invalid
        run: |
          pnpm build
          pnpm run test:dist:root
      - name: Build and verify GitHub Pages project-site artifact
        working-directory: website
        env:
          PUBLIC_BASE_PATH: /django-api-versioning
          SITE_URL: https://example.invalid
        run: |
          pnpm build
          pnpm run test:dist:subpath
