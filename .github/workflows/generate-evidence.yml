name: Generate source-pinned website evidence

on:
  workflow_dispatch:
  push:
    branches:
      - "deps/**"

permissions:
  contents: read

concurrency:
  group: source-evidence-${{ github.ref }}
  cancel-in-progress: true

jobs:
  generate-and-verify:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 35
    steps:
      - name: Require a short-lived branch
        run: |
          case "$GITHUB_REF" in
            refs/heads/*) ;;
            *) echo "Dispatch this helper on a branch, not a tag or other ref." >&2; exit 1 ;;
          esac
          if [ "$GITHUB_REF_NAME" = "main" ]; then
            echo "Dispatch this helper on a short-lived topic branch, never main." >&2
            exit 1
          fi

      - name: Check out the exact dispatch commit without a persistent token
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: "3.15"
          cache: pip
          cache-dependency-path: requirements-ci.txt

      - name: Install integration dependencies
        run: python -m pip install -r requirements-ci.txt

      - name: Generate evidence from the exact triggering checkout
        env:
          SOURCE_COMMIT: ${{ github.sha }}
        run: python integration_test_project/segment_lab/generate_routes.py

      - name: Verify repeated evidence generation is idempotent
        env:
          SOURCE_COMMIT: ${{ github.sha }}
        run: |
          cp website/src/data/generated/routes.json /tmp/routes-first.json
          cp website/src/data/generated/check_versions_output.txt /tmp/check-versions-first.txt
          python integration_test_project/segment_lab/generate_routes.py
          cmp /tmp/routes-first.json website/src/data/generated/routes.json
          cmp /tmp/check-versions-first.txt website/src/data/generated/check_versions_output.txt

      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1  # v7.1.0
        with:
          node-version: "22.23.4"

      - name: Enable the pinned pnpm version
        run: |
          corepack enable
          corepack prepare pnpm@10.12.1 --activate

      - name: Validate website scripts and install the frozen lockfile
        working-directory: website
        run: |
          node --check scripts/sync-articles.mjs
          node --check scripts/sync-reference.mjs
          node --check scripts/check-dist.mjs
          pnpm install --frozen-lockfile

      - name: Run website unit and distribution tests
        working-directory: website
        run: pnpm test

      - name: Type-check the TanStack website
        working-directory: website
        run: pnpm typecheck

      - name: Build and verify root-hosted static output
        working-directory: website
        env:
          PUBLIC_BASE_PATH: /
          SITE_URL: https://example.invalid
        run: |
          pnpm build
          pnpm run test:dist:root

      - name: Build and verify project-subpath static output
        working-directory: website
        env:
          PUBLIC_BASE_PATH: /django-api-versioning
          SITE_URL: https://example.invalid
        run: |
          pnpm build
          pnpm run test:dist:subpath

      - name: Upload only the generated evidence files
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: source-pinned-website-evidence
          path: |
            website/src/data/generated/routes.json
            website/src/data/generated/check_versions_output.txt
          if-no-files-found: error
          retention-days: 1

  generate-dependency-locks:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 15
    steps:
      - name: Check out the exact dependency branch commit without a persistent token
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Python for the pinned uv toolchain
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.15"

      - name: Install tox and tox-uv (provides the uv CLI used by CI)
        run: python -m pip install tox tox-uv

      - name: Set up Node for the pinned pnpm toolchain
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22.23.4"

      - name: Regenerate lockfiles from dependency manifests only
        run: |
          set -euo pipefail
          git fetch origin main
          changed="$(git diff --name-only origin/main...HEAD)"

          if printf '%s\n' "$changed" | grep -Fxq 'pyproject.toml'; then
            uv lock
          fi

          if printf '%s\n' "$changed" | grep -Fxq 'website/package.json'; then
            corepack enable
            corepack prepare pnpm@10.12.1 --activate
            (cd website && pnpm install --lockfile-only --ignore-scripts)
          fi

          mkdir -p "$RUNNER_TEMP/dependency-lockfiles/website"
          cp uv.lock "$RUNNER_TEMP/dependency-lockfiles/uv.lock"
          cp website/pnpm-lock.yaml "$RUNNER_TEMP/dependency-lockfiles/website/pnpm-lock.yaml"

      - name: Upload generated lockfiles for the isolated commit job
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dependency-lockfiles
          path: ${{ runner.temp }}/dependency-lockfiles/
          if-no-files-found: error
          retention-days: 1

  commit-evidence:
    needs: [generate-and-verify, generate-dependency-locks]
    if: >-
      always() &&
      ((github.event_name == 'workflow_dispatch' && needs.generate-and-verify.result == 'success') ||
       (github.event_name == 'push' && needs.generate-dependency-locks.result == 'success'))
    runs-on: ubuntu-latest
    permissions:
      contents: write
    timeout-minutes: 5
    steps:
      - name: Require the branch to remain at the triggering commit
        env:
          GITHUB_EVENT_NAME: ${{ github.event_name }}
        run: |
          case "$GITHUB_REF" in
            refs/heads/*) ;;
            *) echo "Evidence can only be committed to a branch." >&2; exit 1 ;;
          esac
          if [ "$GITHUB_REF_NAME" = "main" ]; then
            echo "Direct commits to main are forbidden." >&2
            exit 1
          fi

      - name: Check out the exact dispatch commit for the evidence commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
        with:
          ref: ${{ github.sha }}
          persist-credentials: true

      - name: Download verified evidence
        if: github.event_name == 'workflow_dispatch'
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8.0.2
        with:
          name: source-pinned-website-evidence
          path: generated-evidence

      - name: Download generated dependency lockfiles
        if: github.event_name == 'push'
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8.0.2
        with:
          name: dependency-lockfiles
          path: generated-lockfiles

      - name: Commit generated files with bot identity
        env:
          GITHUB_EVENT_NAME: ${{ github.event_name }}
        run: |
          set -euo pipefail

          git fetch origin "$GITHUB_REF_NAME"
          remote_sha="$(git rev-parse FETCH_HEAD)"
          if [ "$remote_sha" != "$GITHUB_SHA" ]; then
            echo "Branch advanced after evidence generation. No commit was made; rerun this workflow on the latest branch head." >&2
            exit 1
          fi

          if [ "$GITHUB_EVENT_NAME" = "push" ]; then
            test -f generated-lockfiles/uv.lock
            test -f generated-lockfiles/website/pnpm-lock.yaml
            cp generated-lockfiles/uv.lock uv.lock
            cp generated-lockfiles/website/pnpm-lock.yaml website/pnpm-lock.yaml
            git add -- uv.lock website/pnpm-lock.yaml
          else
            test -f generated-evidence/routes.json
            test -f generated-evidence/check_versions_output.txt
            mkdir -p website/src/data/generated
            cp generated-evidence/routes.json website/src/data/generated/routes.json
            cp generated-evidence/check_versions_output.txt website/src/data/generated/check_versions_output.txt
            git add -- website/src/data/generated/routes.json website/src/data/generated/check_versions_output.txt
          fi

          git diff --check
          if git diff --cached --quiet; then
            echo "Generated files are already current at $GITHUB_SHA."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore(deps): refresh dependency lockfiles"
          git push origin "HEAD:refs/heads/$GITHUB_REF_NAME"
