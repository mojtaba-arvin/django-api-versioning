name: Generate source-pinned website evidence

on:
  push:
    branches: [audit/comprehensive-package-review]
    paths:
      - ".github/workflows/generate-evidence.yml"

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: "3.15"
          cache: pip
          cache-dependency-path: requirements-ci.txt
      - name: Install integration dependencies
        run: python -m pip install -r requirements-ci.txt
      - name: Validate article synchronisation script
        run: |
          node --check website/scripts/sync-articles.mjs
          node website/scripts/sync-articles.mjs
      - name: Generate evidence from the exact checkout
        run: |
          python integration_test_project/segment_lab/generate_routes.py
          python integration_test_project/segment_lab/generate_routes.py --check
      - name: Commit generated evidence
        run: |
          git diff --check
          git add website/src/data/generated/routes.json website/src/data/generated/check_versions_output.txt
          git config user.name "Mojtaba Arvin"
          git config user.email "m.arvin@live.com"
          git commit -m "data: generate source-pinned Segment Lab evidence"
          git push origin "HEAD:${GITHUB_REF_NAME}"
