name: Generate source-pinned website evidence

on:
  push:
    branches: [audit/comprehensive-package-review]
    paths:
      - ".github/workflows/generate-evidence.yml"
      - "django_api_versioning/**"
      - "integration_test_project/**"
      - "pyproject.toml"
      - "requirements.txt"
      - "requirements-ci.txt"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: source-evidence-${{ github.ref }}
  cancel-in-progress: true

jobs:
  generate-and-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: "3.15"
          cache: pip
          cache-dependency-path: requirements-ci.txt
      - uses: actions/setup-node@v6
        with:
          node-version: "22.23.4"
          cache: npm
          cache-dependency-path: website/package-lock.json
      - name: Install integration dependencies
        run: python -m pip install -r requirements-ci.txt
      - name: Install locked website dependencies
        working-directory: website
        run: npm ci
      - name: Audit website dependencies
        working-directory: website
        run: npm audit --audit-level=high
      - name: Synchronize canonical articles at the triggering commit
        env:
          SOURCE_COMMIT: ${{ github.sha }}
        run: |
          node --check website/scripts/sync-articles.mjs
          node website/scripts/sync-articles.mjs
      - name: Generate evidence from the exact triggering checkout
        env:
          SOURCE_COMMIT: ${{ github.sha }}
        run: |
          python integration_test_project/segment_lab/generate_routes.py
          python integration_test_project/segment_lab/generate_routes.py --check
      - name: Commit generated evidence when changed
        run: |
          git diff --check
          git add website/src/data/generated/routes.json website/src/data/generated/check_versions_output.txt
          if git diff --cached --quiet; then
            echo "Generated evidence is already current."
          else
            git config user.name "Mojtaba Arvin"
            git config user.email "m.arvin@live.com"
            git commit -m "data: generate source-pinned Segment Lab evidence"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi
      - name: Run website unit tests
        working-directory: website
        run: npm test
      - name: Run Astro type and content checks
        working-directory: website
        run: npm run check
      - name: Build and inspect root-hosted artifact
        working-directory: website
        run: |
          npm run build
          npm run test:dist
      - name: Build and inspect GitHub Pages project-site artifact
        working-directory: website
        env:
          PUBLIC_BASE_PATH: /django-api-versioning
        run: |
          npm run build
          npm run test:dist
