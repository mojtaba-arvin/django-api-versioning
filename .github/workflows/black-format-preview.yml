name: Black and isort format preview

on:
  push:
    branches: [audit/comprehensive-package-review]
    paths:
      - ".github/workflows/black-format-preview.yml"

permissions:
  contents: write

jobs:
  preview:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: "3.15"
      - run: python -m pip install black isort
      - name: Apply Black and isort formatting
        run: |
          black .
          isort .
      - name: Commit formatted Python files
        run: |
          git diff --check
          if ! git diff --quiet; then
            git config user.name "Mojtaba Arvin"
            git config user.email "m.arvin@live.com"
            git add -u
            git commit -m "style: apply isort formatting to Python imports"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi
