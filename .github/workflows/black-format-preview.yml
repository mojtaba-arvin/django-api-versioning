name: Black format preview

on:
  push:
    branches: [audit/comprehensive-package-review]
    paths:
      - ".github/workflows/black-format-preview.yml"

permissions:
  contents: read

jobs:
  preview:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: "3.15"
      - run: python -m pip install black
      - name: Print formatter diff
        run: black --diff .
