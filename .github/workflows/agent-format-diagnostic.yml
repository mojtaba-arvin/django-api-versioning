name: Temporary Black format diff

on:
  push:
    branches: [audit/comprehensive-package-review]
    paths:
      - "scripts/agent.py"

permissions:
  contents: read

jobs:
  show-diff:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.10"

      - name: Show formatter diff
        run: |
          python -m pip install "black>=26.10.1"
          black --diff scripts/agent.py
