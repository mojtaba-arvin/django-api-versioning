name: Adversarial quality gates

on:
  workflow_call:
  push:
    branches: ["audit/**"]
  pull_request:
    branches: [main]
    paths:
      - "django_api_versioning/**"
      - "tests/**"
      - "integration_test_project/**"
      - "examples/openapi_contract/**"
      - "scripts/fuzz_negotiation.py"
      - "fuzz_corpus/**"
      - "pyproject.toml"
      - ".github/workflows/adversarial-testing.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: adversarial-testing-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: false

jobs:
  mutation:
    name: Mutation testing (mutmut)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-ci.txt
      - name: Install test and mutation dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .
          python -m pip install -r requirements-ci.txt
          python -m pip install "mutmut==3.6.0"
      - name: Run mutation analysis
        run: |
          python -m mutmut run
          python -m mutmut results | tee "$RUNNER_TEMP/mutmut-results.txt"
      - name: Preserve mutation report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: mutmut-results
          path: |
            ${{ runner.temp }}/mutmut-results.txt
            .mutmut-cache
            mutants
          if-no-files-found: ignore
          retention-days: 14

  atheris:
    name: Coverage-guided parser fuzzing (Atheris)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-ci.txt
      - name: Install package and fuzzing dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .
          python -m pip install -r requirements-ci.txt "atheris==2.3.0"
      - name: Run seeded fuzz campaign
        run: |
          corpus="$RUNNER_TEMP/negotiation-corpus"
          mkdir -p "$corpus"
          cp fuzz_corpus/negotiation/* "$corpus/"
          python scripts/fuzz_negotiation.py "$corpus" \
            -atheris_runs=100000 \
            -max_len=65536 \
            -timeout=2
      - name: Upload minimized crash corpus
        if: failure() && hashFiles('crash-*') != ''
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: atheris-crash-inputs
          path: crash-*
          if-no-files-found: ignore
          retention-days: 30

  schemathesis:
    name: OpenAPI-generated adversarial API tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements-ci.txt
            examples/openapi_contract/requirements.txt
      - name: Install consumer contract and Schemathesis
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .
          python -m pip install -r requirements-ci.txt
          python -m pip install -r examples/openapi_contract/requirements.txt
          python -m pip install schemathesis
      - name: Generate reviewed V1 and V2 schemas
        run: |
          python examples/openapi_contract/verify.py
          python examples/openapi_contract/generate_schemas.py \
            --output-dir "$RUNNER_TEMP/schemathesis-schemas"
      - name: Run generated positive, negative, and fuzzing scenarios against WSGI app
        working-directory: examples/openapi_contract
        run: |
          export PYTHONPATH="$GITHUB_WORKSPACE:$PWD"
          st run "$RUNNER_TEMP/schemathesis-schemas/v1/openapi.yaml" \
            --app contract_project.wsgi:application \
            --phases examples,coverage,fuzzing \
            --max-examples 100 \
            --max-time 300 \
            --report junit \
            --report-junit-path "$RUNNER_TEMP/schemathesis-v1.xml"
          st run "$RUNNER_TEMP/schemathesis-schemas/v2/openapi.yaml" \
            --app contract_project.wsgi:application \
            --phases examples,coverage,fuzzing \
            --max-examples 100 \
            --max-time 300 \
            --report junit \
            --report-junit-path "$RUNNER_TEMP/schemathesis-v2.xml"
      - name: Upload Schemathesis reports
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: schemathesis-reports
          path: ${{ runner.temp }}/schemathesis-*.xml
          if-no-files-found: warn
          retention-days: 14
