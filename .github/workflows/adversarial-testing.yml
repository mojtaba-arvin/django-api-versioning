name: Adversarial quality gates

on:
  workflow_call:
    inputs:
      run_mutation:
        description: Run the mutation-testing shards.
        type: boolean
        required: false
        default: false
  workflow_dispatch:
    inputs:
      run_mutation:
        description: Run the mutation-testing shards.
        type: boolean
        required: false
        default: true
  schedule:
    - cron: "41 3 * * 2"

permissions:
  contents: read

jobs:
  mutation-coverage:
    if: inputs.run_mutation == true
    name: Mutation test coverage baseline
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-ci.txt
      - name: Install test dependencies
        run: |
          python -m pip install -e . -r requirements-ci.txt
      - name: Collect test-to-source coverage once
        run: |
          python -m pytest --cov=django_api_versioning --cov-context=test --cov-report= -q -o addopts= tests
      - name: Validate per-test coverage contexts
        run: |
          python - <<'PY'
          from coverage import CoverageData

          data = CoverageData()
          data.read()
          context_count = 0
          node_ids = set()
          for filename in data.measured_files():
              for contexts in data.contexts_by_lineno(filename).values():
                  for context in contexts:
                      if not context:
                          continue
                      context_count += 1
                      node_ids.add(context.split("|", 1)[0])

          if not context_count or not node_ids:
              raise SystemExit("Coverage did not record pytest test contexts")
          print(
              f"Recorded {context_count} line-context entries across "
              f"{len(node_ids)} pytest test node IDs"
          )
          print("Sample node IDs:", *sorted(node_ids)[:5], sep="\\n  ")
          PY
      - name: Stage coverage data for artifact upload
        run: cp .coverage coverage.data
      - name: Share coverage data with mutation shards
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: mutation-coverage-data
          path: coverage.data
          if-no-files-found: error
          retention-days: 1

  mutation-decorators:
    if: inputs.run_mutation == true
    name: Decorator mutation shard
    needs: mutation-coverage
    runs-on: ubuntu-latest
    timeout-minutes: ${{ github.event_name == 'pull_request' && 30 || 60 }}
    steps:
      - name: Check out the pull request head before loading the local action
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Run Decorators mutation campaign
        uses: ./.github/actions/mutation-shard
        with:
          target_id: decorators
          target_path: django_api_versioning/decorators.py
  decorator-score:
    if: always() && inputs.run_mutation == true
    name: Decorator mutation gate (100% threshold)
    needs: mutation-decorators
    runs-on: ubuntu-latest
    steps:
      - name: Download decorator mutation report
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: mutmut-decorators
          path: mutation-report
      - name: Enforce the dynamic decorator mutation threshold
        run: |
          python - <<'PY'
          import json
          import math
          from pathlib import Path

          reports = list(Path("mutation-report").rglob("decorators.json"))
          if len(reports) != 1:
              raise SystemExit(f"Expected one decorator report, found {len(reports)}")
          report = json.loads(reports[0].read_text())
          if report.get("target") != "decorators":
              raise SystemExit("Decorator report target mismatch")

          if report["completed"] != report["total"]:
              raise SystemExit("Decorator mutation campaign is incomplete")
          outcomes = sum(
              report[key]
              for key in ("killed", "survived", "timed_out", "suspicious", "skipped")
          )
          if outcomes != report["total"]:
              raise SystemExit("Decorator mutation outcomes do not reconcile")
          if report["timed_out"] or report["suspicious"] or report["skipped"]:
              raise SystemExit("Decorator campaign has unresolved mutant outcomes")

          score = 100.0 * report["killed"] / report["total"]
          print(
              f"Decorator mutation score: {score:.2f}% "
              f"({report['killed']}/{report['total']} killed); required: 100.00%"
          )
          if report["killed"] != report["total"]:
              raise SystemExit("Decorator mutation score must be exactly 100%")
          PY

  mutation-others:
    if: inputs.run_mutation == true
    name: Downstream mutation shard (${{ matrix.id }})
    needs: mutation-coverage
    runs-on: ubuntu-latest
    timeout-minutes: ${{ github.event_name == 'pull_request' && 30 || 60 }}
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        include:
          - id: lifecycle
            path: django_api_versioning/lifecycle.py
          - id: negotiation
            path: django_api_versioning/negotiation.py
          - id: registry
            path: django_api_versioning/registry.py
          - id: routers
            path: django_api_versioning/routers.py
    steps:
      - name: Check out the pull request head before loading the local action
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Run ${{ matrix.id }} mutation campaign
        uses: ./.github/actions/mutation-shard
        with:
          target_id: ${{ matrix.id }}
          target_path: ${{ matrix.path }}
  mutation-score:
    if: always() && inputs.run_mutation == true
    name: Mutation score (combined)
    runs-on: ubuntu-latest
    needs:
      - decorator-score
      - mutation-others
    steps:
      - name: Download all mutation shard reports
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          pattern: mutmut-*
          path: mutation-reports
          merge-multiple: true
        continue-on-error: true
      - name: Validate complete mutation campaign and enforce aggregate score
        env:
          MUTATION_OTHERS_RESULT: ${{ needs.mutation-others.result }}
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          is_decorator_only = os.environ.get("MUTATION_OTHERS_RESULT") == "skipped"
          expected = (
              {"decorators"}
              if is_decorator_only
              else {"decorators", "lifecycle", "negotiation", "registry", "routers"}
          )
          reports = {}
          for path in Path("mutation-reports").rglob("*.json"):
              report = json.loads(path.read_text())
              target = report.get("target")
              if target in reports:
                  raise SystemExit(f"Duplicate mutation report for {target}")
              reports[target] = report

          missing = expected - reports.keys()
          unexpected = reports.keys() - expected
          if unexpected:
              raise SystemExit(f"Unexpected mutation reports: {sorted(unexpected)}")

          totals = {key: sum(report[key] for report in reports.values()) for key in (
              "completed", "total", "killed", "survived", "timed_out", "suspicious", "skipped"
          )}
          if missing:
              print(f"PARTIAL campaign; missing reports: {sorted(missing)}")
          if is_decorator_only:
              print("Decorator-only mutation campaign; downstream mutation targets remain locked:")
          else:
              print("Full-suite mutation score after decorator gate:")
          print("Available shard results:")
          for target in sorted(reports):
              report = reports[target]
              target_total = report["total"]
              target_score = 100.0 * report["killed"] / target_total if target_total else 0.0
              print(
                  f"  {target}: {target_score:.2f}% "
                  f"({report['killed']} killed, {report['survived']} survived, "
                  f"{report['completed']}/{target_total} completed)"
              )
              if report["killed"] != target_total:
                  raise SystemExit(
                      f"{target} mutation score must be exactly 100%; "
                      f"found {report['killed']}/{target_total}"
                  )
          if totals["total"] == 0:
              raise SystemExit("No mutation shard reports were produced")
          if totals["completed"] != totals["total"]:
              raise SystemExit("Mutation campaign is partial; see available shard totals above")
          if totals["killed"] + totals["survived"] + totals["timed_out"] + totals["suspicious"] + totals["skipped"] != totals["total"]:
              raise SystemExit("Combined mutation totals do not reconcile")
          if totals["timed_out"] or totals["suspicious"] or totals["skipped"]:
              raise SystemExit("Combined campaign contains unresolved mutant outcomes")
          if missing:
              raise SystemExit("Mutation campaign is partial; see available shard totals above")

          score = 100.0 * totals["killed"] / totals["total"]
          minimum = 100.0
          print(
              f"Combined mutation score: {score:.2f}% "
              f"({totals['killed']} killed, {totals['survived']} survived, "
              f"{totals['total']} total; minimum {minimum:.2f}%)"
          )
          if score < minimum:
              raise SystemExit("Combined mutation score is below the configured minimum")
          PY

  atheris:
    name: Coverage-guided parser fuzzing (Atheris)
    runs-on: ubuntu-latest
    timeout-minutes: ${{ github.event_name == 'pull_request' && 10 || 20 }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-ci.txt
      - name: Install package and fuzzing dependencies
        run: |
          python -m pip install -e . -r requirements-ci.txt "atheris==2.3.0"
      - name: Run seeded fuzz campaign
        run: |
          corpus="$RUNNER_TEMP/negotiation-corpus"
          mkdir -p "$corpus"
          cp fuzz_corpus/negotiation/* "$corpus/"
          mkdir -p "$RUNNER_TEMP/atheris-artifacts"
          python scripts/fuzz_negotiation.py "$corpus" \
            -atheris_runs="$([ "$GITHUB_EVENT_NAME" = "pull_request" ] && echo 10000 || echo 100000)" \
            -max_len=65536 \
            -timeout=2 \
            -artifact_prefix="$RUNNER_TEMP/atheris-artifacts/" 2>&1 | tee "$RUNNER_TEMP/atheris.log"
      - name: Preserve Atheris timeout and crash inputs
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: atheris-failure-artifacts
          path: |
            ${{ runner.temp }}/atheris-artifacts/*
            ${{ runner.temp }}/atheris.log
          if-no-files-found: ignore
          retention-days: 30

  schemathesis:
    name: OpenAPI-generated adversarial API tests
    runs-on: ubuntu-latest
    timeout-minutes: ${{ github.event_name == 'pull_request' && 15 || 30 }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements-ci.txt
            examples/openapi_contract/requirements.txt
      - name: Install consumer contract and Schemathesis
        run: |
          python -m pip install -e . -r requirements-ci.txt -r examples/openapi_contract/requirements.txt schemathesis
      - name: Generate reviewed V1 and V2 schemas
        run: |
          python examples/openapi_contract/verify.py
          python examples/openapi_contract/generate_schemas.py \
            --output-dir "$RUNNER_TEMP/schemathesis-schemas"
      - name: Start the consumer API
        working-directory: examples/openapi_contract
        run: |
          python manage.py runserver 127.0.0.1:8000 --noreload > "$RUNNER_TEMP/django-runserver.log" 2>&1 &
          echo $! > "$RUNNER_TEMP/django-runserver.pid"
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://localhost:8000/api/v1/products/ >/dev/null; then
              break
            fi
            sleep 1
          done
          curl --fail --silent http://localhost:8000/api/v1/products/ >/dev/null
          curl --fail --silent http://localhost:8000/api/v2/products/ >/dev/null
      - name: Run generated positive, negative, and fuzzing scenarios against HTTP API
        working-directory: examples/openapi_contract
        run: |
          if [ "$GITHUB_EVENT_NAME" = "pull_request" ]; then
            max_examples=15
            max_time=30
            phases=examples,fuzzing
          else
            max_examples=100
            max_time=300
            phases=examples,coverage,fuzzing
          fi
          st run "$RUNNER_TEMP/schemathesis-schemas/v1/openapi.yaml" \
            --url http://localhost:8000 \
            --phases "$phases" \
            --max-examples "$max_examples" \
            --max-time "$max_time" \
            --report junit \
            --report-junit-path "$RUNNER_TEMP/schemathesis-v1.xml"
          st run "$RUNNER_TEMP/schemathesis-schemas/v2/openapi.yaml" \
            --url http://localhost:8000 \
            --phases "$phases" \
            --max-examples "$max_examples" \
            --max-time "$max_time" \
            --report junit \
            --report-junit-path "$RUNNER_TEMP/schemathesis-v2.xml"
      - name: Upload Schemathesis reports
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: schemathesis-reports
          path: ${{ runner.temp }}/schemathesis-*.xml
          if-no-files-found: warn
          retention-days: 14
