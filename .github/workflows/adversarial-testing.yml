name: Adversarial quality gates

on:
  workflow_call:
  workflow_dispatch:
  schedule:
    - cron: "41 3 * * 2"

permissions:
  contents: read

jobs:
  mutation-coverage:
    if: github.event_name != 'push'
    name: Mutation test coverage baseline
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-ci.txt
      - name: Install test dependencies
        run: |
          python -m pip install -e . -r requirements-ci.txt
      - name: Collect test-to-source coverage once
        run: |
          python -m pytest --cov=django_api_versioning --cov-context=test --cov-report= -q -o addopts= tests
      - name: Validate per-test coverage contexts
        run: |
          python - <<'PY'
          from coverage import CoverageData

          data = CoverageData()
          data.read()
          context_count = 0
          node_ids = set()
          for filename in data.measured_files():
              for contexts in data.contexts_by_lineno(filename).values():
                  for context in contexts:
                      if not context:
                          continue
                      context_count += 1
                      node_ids.add(context.split("|", 1)[0])

          if not context_count or not node_ids:
              raise SystemExit("Coverage did not record pytest test contexts")
          print(
              f"Recorded {context_count} line-context entries across "
              f"{len(node_ids)} pytest test node IDs"
          )
          print("Sample node IDs:", *sorted(node_ids)[:5], sep="\\n  ")
          PY
      - name: Stage coverage data for artifact upload
        run: cp .coverage coverage.data
      - name: Share coverage data with mutation shards
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: mutation-coverage-data
          path: coverage.data
          if-no-files-found: error
          retention-days: 1

  mutation:
    if: github.event_name != 'push'
    name: Mutation shard (${{ matrix.id }})
    needs: mutation-coverage
    runs-on: ubuntu-latest
    timeout-minutes: ${{ github.event_name == 'pull_request' && 15 || 60 }}
    strategy:
      fail-fast: false
      max-parallel: 5
      matrix:
        # PRs run the decorator gate in isolation. Other mutation targets are
        # deliberately withheld until this focused gate has passed.
        include: ${{ github.event_name == 'pull_request' && fromJSON('[{"id":"decorators","path":"django_api_versioning/decorators.py"}]') || fromJSON('[{"id":"decorators","path":"django_api_versioning/decorators.py"},{"id":"lifecycle","path":"django_api_versioning/lifecycle.py"},{"id":"negotiation","path":"django_api_versioning/negotiation.py"},{"id":"registry","path":"django_api_versioning/registry.py"},{"id":"routers","path":"django_api_versioning/routers.py"}]') }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-ci.txt
      - name: Restore target-specific mutation cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: |
            .mutmut-cache
            mutants
          key: mutmut-${{ runner.os }}-${{ matrix.id }}-${{ github.event_name }}-contexts-v3-sample1-${{ hashFiles(matrix.path, 'tests/**/*.py', 'setup.cfg', 'mutmut_config.py', 'requirements-ci.txt') }}
      - name: Install test and mutation dependencies
        run: |
          python -m pip install -e . -r requirements-ci.txt "mutmut==2.5.1"
      - name: Scope mutation generation to this shard
        env:
          MUTATION_TARGET: ${{ matrix.path }}
        run: |
          python - <<'PY'
          import os
          import re
          from pathlib import Path

          config = Path("setup.cfg")
          source = config.read_text()
          updated, replacements = re.subn(
              r"(?m)^paths_to_mutate\s*=.*$",
              f"paths_to_mutate = {os.environ['MUTATION_TARGET']}",
              source,
          )
          if replacements != 1:
              raise SystemExit("Expected exactly one [mutmut] paths_to_mutate setting")

          depth = 4 if os.environ["GITHUB_EVENT_NAME"] == "pull_request" else 8
          updated, depth_replacements = re.subn(
              r"(?m)^max_stack_depth\s*=.*$",
              f"max_stack_depth = {depth}",
              updated,
          )
          if depth_replacements != 1:
              raise SystemExit("Expected exactly one [mutmut] max_stack_depth setting")
          config.write_text(updated)
          PY
      - name: Download shared mutation coverage data
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: mutation-coverage-data
          path: .
      - name: Restore coverage.py's expected data filename
        run: mv coverage.data .coverage
      - name: Run mutation analysis
        env:
          MUTATION_TARGET_ID: ${{ matrix.id }}
        shell: bash
        run: |
          set -euo pipefail
          if [ "$GITHUB_EVENT_NAME" = "pull_request" ]; then
            mutation_args=(--use-coverage)
          else
            mutation_args=(--use-coverage --rerun-all)
          fi
          if mutmut run "${mutation_args[@]}" > "$RUNNER_TEMP/mutmut-run.log" 2>&1; then
            mutation_status=0
          else
            mutation_status=$?
          fi
          tail -n 30 "$RUNNER_TEMP/mutmut-run.log"
          if [ "$mutation_status" -ne 0 ] && [ "$mutation_status" -ne 2 ]; then
            echo "Mutation runner failed with exit code $mutation_status" >&2
            exit "$mutation_status"
          fi

          if mutmut results > "$RUNNER_TEMP/${MUTATION_TARGET_ID}-results.txt"; then
            :
          else
            results_status=$?
            if [ "$results_status" -ne 2 ] || [ ! -s "$RUNNER_TEMP/${MUTATION_TARGET_ID}-results.txt" ]; then
              echo "Unable to collect mutmut's per-mutant report (exit $results_status)" >&2
              exit "$results_status"
            fi
          fi

          # Preserve exact survivor diffs and test contexts on PR gate runs too.
          detail_args=(--details)
          python scripts/export_mutation_report.py \
            --target "$MUTATION_TARGET_ID" \
            --cache .mutmut-cache \
            --coverage .coverage \
            --results "$RUNNER_TEMP/${MUTATION_TARGET_ID}-results.txt" \
            --run-log "$RUNNER_TEMP/mutmut-run.log" \
            --runner-exit "$mutation_status" \
            --summary "$RUNNER_TEMP/${MUTATION_TARGET_ID}.json" \
            --report "$RUNNER_TEMP/${MUTATION_TARGET_ID}-mutants.ndjson" \
            "${detail_args[@]}"
      - name: Preserve shard diagnostics
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: mutmut-${{ matrix.id }}
          path: |
            ${{ runner.temp }}/${{ matrix.id }}.json
            ${{ runner.temp }}/mutmut-run.log
            ${{ runner.temp }}/${{ matrix.id }}-results.txt
            ${{ runner.temp }}/${{ matrix.id }}-mutants.ndjson
            .mutmut-cache
            mutants
          if-no-files-found: ignore
          include-hidden-files: true
          retention-days: 14

  mutation-score:
    if: github.event_name != 'push'
    name: Mutation score (combined)
    runs-on: ubuntu-latest
    needs: mutation
    steps:
      - name: Download all mutation shard reports
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          pattern: mutmut-*
          path: mutation-reports
          merge-multiple: true
      - name: Validate complete mutation campaign and enforce aggregate score
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          is_pull_request = os.environ.get("GITHUB_EVENT_NAME") == "pull_request"
          expected = (
              {"decorators"}
              if is_pull_request
              else {"decorators", "lifecycle", "negotiation", "registry", "routers"}
          )
          reports = {}
          for path in Path("mutation-reports").rglob("*.json"):
              report = json.loads(path.read_text())
              target = report.get("target")
              if target in reports:
                  raise SystemExit(f"Duplicate mutation report for {target}")
              reports[target] = report

          missing = expected - reports.keys()
          unexpected = reports.keys() - expected
          if missing or unexpected:
              raise SystemExit(
                  f"Incomplete mutation campaign; missing={sorted(missing)}, "
                  f"unexpected={sorted(unexpected)}"
              )

          totals = {key: sum(report[key] for report in reports.values()) for key in (
              "completed", "total", "killed", "survived", "timed_out", "suspicious", "skipped"
          )}
          if totals["total"] == 0 or totals["completed"] != totals["total"]:
              raise SystemExit("Combined mutation campaign did not complete all generated mutants")
          if totals["killed"] + totals["survived"] + totals["timed_out"] + totals["suspicious"] + totals["skipped"] != totals["total"]:
              raise SystemExit("Combined mutation totals do not reconcile")
          if totals["timed_out"] or totals["suspicious"] or totals["skipped"]:
              raise SystemExit("Combined campaign contains unresolved mutant outcomes")

          score = 100.0 * totals["killed"] / totals["total"]
          minimum = 70.0
          if is_pull_request:
              print("Decorator mutation gate (PR-isolated; other mutation targets remain blocked):")
          else:
              print("Full-suite mutation score:")
          print("Per-target mutation results:")
          for target in sorted(reports):
              report = reports[target]
              target_score = 100.0 * report["killed"] / report["total"]
              print(
                  f"  {target}: {target_score:.2f}% "
                  f"({report['killed']}/{report['total']} killed)"
              )
          print(
              f"Combined mutation score: {score:.2f}% "
              f"({totals['killed']} killed, {totals['survived']} survived, "
              f"{totals['total']} total; minimum {minimum:.2f}%)"
          )
          if score < minimum:
              raise SystemExit("Combined mutation score is below the configured minimum")
          PY

  atheris:
    name: Coverage-guided parser fuzzing (Atheris)
    runs-on: ubuntu-latest
    timeout-minutes: ${{ github.event_name == 'pull_request' && 10 || 20 }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-ci.txt
      - name: Install package and fuzzing dependencies
        run: |
          python -m pip install -e . -r requirements-ci.txt "atheris==2.3.0"
      - name: Run seeded fuzz campaign
        run: |
          corpus="$RUNNER_TEMP/negotiation-corpus"
          mkdir -p "$corpus"
          cp fuzz_corpus/negotiation/* "$corpus/"
          mkdir -p "$RUNNER_TEMP/atheris-artifacts"
          python scripts/fuzz_negotiation.py "$corpus" \
            -atheris_runs="$([ "$GITHUB_EVENT_NAME" = "pull_request" ] && echo 10000 || echo 100000)" \
            -max_len=65536 \
            -timeout=2 \
            -artifact_prefix="$RUNNER_TEMP/atheris-artifacts/" 2>&1 | tee "$RUNNER_TEMP/atheris.log"
      - name: Preserve Atheris timeout and crash inputs
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: atheris-failure-artifacts
          path: |
            ${{ runner.temp }}/atheris-artifacts/*
            ${{ runner.temp }}/atheris.log
          if-no-files-found: ignore
          retention-days: 30

  schemathesis:
    name: OpenAPI-generated adversarial API tests
    runs-on: ubuntu-latest
    timeout-minutes: ${{ github.event_name == 'pull_request' && 15 || 30 }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements-ci.txt
            examples/openapi_contract/requirements.txt
      - name: Install consumer contract and Schemathesis
        run: |
          python -m pip install -e . -r requirements-ci.txt -r examples/openapi_contract/requirements.txt schemathesis
      - name: Generate reviewed V1 and V2 schemas
        run: |
          python examples/openapi_contract/verify.py
          python examples/openapi_contract/generate_schemas.py \
            --output-dir "$RUNNER_TEMP/schemathesis-schemas"
      - name: Start the consumer API
        working-directory: examples/openapi_contract
        run: |
          python manage.py runserver 127.0.0.1:8000 --noreload > "$RUNNER_TEMP/django-runserver.log" 2>&1 &
          echo $! > "$RUNNER_TEMP/django-runserver.pid"
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://localhost:8000/api/v1/products/ >/dev/null; then
              break
            fi
            sleep 1
          done
          curl --fail --silent http://localhost:8000/api/v1/products/ >/dev/null
          curl --fail --silent http://localhost:8000/api/v2/products/ >/dev/null
      - name: Run generated positive, negative, and fuzzing scenarios against HTTP API
        working-directory: examples/openapi_contract
        run: |
          if [ "$GITHUB_EVENT_NAME" = "pull_request" ]; then
            max_examples=15
            max_time=30
            phases=examples,fuzzing
          else
            max_examples=100
            max_time=300
            phases=examples,coverage,fuzzing
          fi
          st run "$RUNNER_TEMP/schemathesis-schemas/v1/openapi.yaml" \
            --url http://localhost:8000 \
            --phases "$phases" \
            --max-examples "$max_examples" \
            --max-time "$max_time" \
            --report junit \
            --report-junit-path "$RUNNER_TEMP/schemathesis-v1.xml"
          st run "$RUNNER_TEMP/schemathesis-schemas/v2/openapi.yaml" \
            --url http://localhost:8000 \
            --phases "$phases" \
            --max-examples "$max_examples" \
            --max-time "$max_time" \
            --report junit \
            --report-junit-path "$RUNNER_TEMP/schemathesis-v2.xml"
      - name: Upload Schemathesis reports
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: schemathesis-reports
          path: ${{ runner.temp }}/schemathesis-*.xml
          if-no-files-found: warn
          retention-days: 14
