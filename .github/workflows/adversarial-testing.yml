name: Adversarial quality gates

on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  mutation:
    name: Mutation shard (${{ matrix.id }})
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      max-parallel: 5
      matrix:
        include:
          - id: decorators
            path: django_api_versioning/decorators.py
          - id: lifecycle
            path: django_api_versioning/lifecycle.py
          - id: negotiation
            path: django_api_versioning/negotiation.py
          - id: registry
            path: django_api_versioning/registry.py
          - id: routers
            path: django_api_versioning/routers.py
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-ci.txt
      - name: Restore target-specific mutation cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: |
            .mutmut-cache
            mutants
          key: mutmut-${{ runner.os }}-${{ matrix.id }}-${{ hashFiles(matrix.path, 'tests/**/*.py', 'setup.cfg', 'requirements-ci.txt') }}
      - name: Install test and mutation dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .
          python -m pip install -r requirements-ci.txt
          python -m pip install "mutmut==2.5.1"
      - name: Scope mutation generation to this shard
        env:
          MUTATION_TARGET: ${{ matrix.path }}
        run: |
          python - <<'PY'
          import os
          import re
          from pathlib import Path

          config = Path("setup.cfg")
          source = config.read_text()
          updated, replacements = re.subn(
              r"(?m)^paths_to_mutate\s*=.*$",
              f"paths_to_mutate = {os.environ['MUTATION_TARGET']}",
              source,
          )
          if replacements != 1:
              raise SystemExit("Expected exactly one [mutmut] paths_to_mutate setting")
          config.write_text(updated)
          PY
      - name: Collect test-to-source coverage for mutation selection
        run: |
          coverage run --source=django_api_versioning -m pytest -q -p no:pytest_cov -o addopts= tests
      - name: Run mutation analysis
        env:
          MUTATION_TARGET_ID: ${{ matrix.id }}
        shell: bash
        run: |
          set -euo pipefail
          if mutmut run --use-coverage > "$RUNNER_TEMP/mutmut-run.log" 2>&1; then
            mutation_status=0
          else
            mutation_status=$?
          fi
          tail -n 30 "$RUNNER_TEMP/mutmut-run.log"
          if [ "$mutation_status" -ne 0 ] && [ "$mutation_status" -ne 2 ]; then
            echo "Mutation runner failed with exit code $mutation_status" >&2
            exit "$mutation_status"
          fi

          python - "$RUNNER_TEMP/mutmut-run.log" "$RUNNER_TEMP/${MUTATION_TARGET_ID}.json" "$mutation_status" <<'PY'
          import json
          import re
          import sys
          from pathlib import Path

          run_log = Path(sys.argv[1]).read_text(errors="replace")
          output = Path(sys.argv[2])
          mutation_status = int(sys.argv[3])
          matches = re.findall(
              r"(\d+)/(\d+)\s+🎉\s+(\d+)\s+⏰\s+(\d+)\s+🤔\s+(\d+)\s+🙁\s+(\d+)\s+🔇\s+(\d+)",
              run_log,
          )
          if not matches:
              raise SystemExit("Mutation run produced no machine-checkable completion summary")
          completed, total, killed, timed_out, suspicious, survived, skipped = map(int, matches[-1])
          if total == 0 or completed != total:
              raise SystemExit("Mutation shard did not complete its entire generated mutant set")
          if killed + survived + timed_out + suspicious + skipped != total:
              raise SystemExit("Mutation shard totals do not reconcile")
          if timed_out or suspicious or skipped:
              raise SystemExit("Timed-out, suspicious, or skipped mutants are unresolved")
          if mutation_status == 2 and survived == 0:
              raise SystemExit("mutmut returned survivor exit code 2 but no survivors were reported")
          output.write_text(json.dumps({
              "target": output.stem,
              "completed": completed,
              "total": total,
              "killed": killed,
              "survived": survived,
              "timed_out": timed_out,
              "suspicious": suspicious,
              "skipped": skipped,
              "runner_exit": mutation_status,
          }, sort_keys=True) + "\n")
          print(
              f"{output.stem}: {completed}/{total}; killed={killed}; "
              f"survived={survived}; runner_exit={mutation_status}"
          )
          PY

          if mutmut results > "$RUNNER_TEMP/${MUTATION_TARGET_ID}-results.txt"; then
            :
          else
            results_status=$?
            if [ "$results_status" -ne 2 ] || [ ! -s "$RUNNER_TEMP/${MUTATION_TARGET_ID}-results.txt" ]; then
              echo "Unable to collect mutmut's per-mutant report (exit $results_status)" >&2
              exit "$results_status"
            fi
          fi
      - name: Preserve shard diagnostics
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: mutmut-${{ matrix.id }}
          path: |
            ${{ runner.temp }}/${{ matrix.id }}.json
            ${{ runner.temp }}/mutmut-run.log
            ${{ runner.temp }}/${{ matrix.id }}-results.txt
          if-no-files-found: ignore
          retention-days: 14

  mutation-score:
    name: Mutation score (combined)
    runs-on: ubuntu-latest
    needs: mutation
    steps:
      - name: Download all mutation shard reports
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          pattern: mutmut-*
          path: mutation-reports
          merge-multiple: true
      - name: Validate complete mutation campaign and enforce aggregate score
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          expected = {"decorators", "lifecycle", "negotiation", "registry", "routers"}
          reports = {}
          for path in Path("mutation-reports").glob("*.json"):
              report = json.loads(path.read_text())
              target = report.get("target")
              if target in reports:
                  raise SystemExit(f"Duplicate mutation report for {target}")
              reports[target] = report

          missing = expected - reports.keys()
          unexpected = reports.keys() - expected
          if missing or unexpected:
              raise SystemExit(
                  f"Incomplete mutation campaign; missing={sorted(missing)}, "
                  f"unexpected={sorted(unexpected)}"
              )

          totals = {key: sum(report[key] for report in reports.values()) for key in (
              "completed", "total", "killed", "survived", "timed_out", "suspicious", "skipped"
          )}
          if totals["total"] == 0 or totals["completed"] != totals["total"]:
              raise SystemExit("Combined mutation campaign did not complete all generated mutants")
          if totals["killed"] + totals["survived"] + totals["timed_out"] + totals["suspicious"] + totals["skipped"] != totals["total"]:
              raise SystemExit("Combined mutation totals do not reconcile")
          if totals["timed_out"] or totals["suspicious"] or totals["skipped"]:
              raise SystemExit("Combined campaign contains unresolved mutant outcomes")

          score = 100.0 * totals["killed"] / totals["total"]
          minimum = 70.0
          print("Per-target mutation results:")
          for target in sorted(reports):
              report = reports[target]
              target_score = 100.0 * report["killed"] / report["total"]
              print(
                  f"  {target}: {target_score:.2f}% "
                  f"({report['killed']}/{report['total']} killed)"
              )
          print(
              f"Combined mutation score: {score:.2f}% "
              f"({totals['killed']} killed, {totals['survived']} survived, "
              f"{totals['total']} total; minimum {minimum:.2f}%)"
          )
          if score < minimum:
              raise SystemExit("Combined mutation score is below the configured minimum")
          PY

  atheris:
    name: Coverage-guided parser fuzzing (Atheris)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-ci.txt
      - name: Install package and fuzzing dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .
          python -m pip install -r requirements-ci.txt "atheris==2.3.0"
      - name: Run seeded fuzz campaign
        run: |
          corpus="$RUNNER_TEMP/negotiation-corpus"
          mkdir -p "$corpus"
          cp fuzz_corpus/negotiation/* "$corpus/"
          python scripts/fuzz_negotiation.py "$corpus" \
            -atheris_runs=100000 \
            -max_len=65536 \
            -timeout=2
      - name: Upload minimized crash corpus
        if: failure() && hashFiles('crash-*') != ''
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: atheris-crash-inputs
          path: crash-*
          if-no-files-found: ignore
          retention-days: 30

  schemathesis:
    name: OpenAPI-generated adversarial API tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements-ci.txt
            examples/openapi_contract/requirements.txt
      - name: Install consumer contract and Schemathesis
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .
          python -m pip install -r requirements-ci.txt
          python -m pip install -r examples/openapi_contract/requirements.txt
          python -m pip install schemathesis
      - name: Generate reviewed V1 and V2 schemas
        run: |
          python examples/openapi_contract/verify.py
          python examples/openapi_contract/generate_schemas.py \
            --output-dir "$RUNNER_TEMP/schemathesis-schemas"
      - name: Start the consumer API
        working-directory: examples/openapi_contract
        run: |
          python manage.py runserver 127.0.0.1:8000 --noreload > "$RUNNER_TEMP/django-runserver.log" 2>&1 &
          echo $! > "$RUNNER_TEMP/django-runserver.pid"
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://localhost:8000/api/v1/products/ >/dev/null; then
              break
            fi
            sleep 1
          done
          curl --fail --silent http://localhost:8000/api/v1/products/ >/dev/null
          curl --fail --silent http://localhost:8000/api/v2/products/ >/dev/null
      - name: Run generated positive, negative, and fuzzing scenarios against HTTP API
        working-directory: examples/openapi_contract
        run: |
          st run "$RUNNER_TEMP/schemathesis-schemas/v1/openapi.yaml" \
            --url http://localhost:8000 \
            --phases examples,coverage,fuzzing \
            --max-examples 100 \
            --max-time 300 \
            --report junit \
            --report-junit-path "$RUNNER_TEMP/schemathesis-v1.xml"
          st run "$RUNNER_TEMP/schemathesis-schemas/v2/openapi.yaml" \
            --url http://localhost:8000 \
            --phases examples,coverage,fuzzing \
            --max-examples 100 \
            --max-time 300 \
            --report junit \
            --report-junit-path "$RUNNER_TEMP/schemathesis-v2.xml"
      - name: Upload Schemathesis reports
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: schemathesis-reports
          path: ${{ runner.temp }}/schemathesis-*.xml
          if-no-files-found: warn
          retention-days: 14
