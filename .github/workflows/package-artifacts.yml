name: Python package artifacts

on:
  workflow_call:
  # PR checks run when review starts, not on every commit in a long review branch.
  # Use workflow_dispatch for deliberate checkpoints; main remains fully automatic.
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "django_api_versioning/**"
      - "tests/**"
      - "pyproject.toml"
      - "MANIFEST.in"
      - "README.md"
      - "CHANGELOG.md"
      - "LICENSE*"
      - "requirements.txt"
      - "requirements-dev.txt"
      - "pytest.ini"
      - "requirements-build.txt"
      - "scripts/verify_distribution_contents.py"
      - "scripts/smoke_installed_wheel.py"
      - "scripts/check_reproducible_build.py"
      - ".github/workflows/package-artifacts.yml"
permissions:
  contents: read

concurrency:
  group: package-artifacts-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: "3.15"
          cache: pip
          cache-dependency-path: requirements-build.txt

      - name: Install build tools
        run: python -m pip install -r requirements-build.txt

      - name: Verify reproducible source and wheel builds
        run: python scripts/check_reproducible_build.py

      - name: Build source and wheel distributions
        run: |
          export SOURCE_DATE_EPOCH="$(git log -1 --format=%ct)"
          python -m build --no-isolation --outdir dist

      - name: Validate distribution metadata
        run: python -m twine check --strict dist/*

      - name: Install the built wheel and verify its routing behavior
        run: |
          python -m pip install -r requirements.txt
          python -m pip install --no-deps dist/*.whl
          cd /tmp
          python "$GITHUB_WORKSPACE/scripts/smoke_installed_wheel.py"

      - name: Verify package contents
        run: python scripts/verify_distribution_contents.py dist
