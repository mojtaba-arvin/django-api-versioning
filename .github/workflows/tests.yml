name: Python tests

on:
  workflow_call:
    inputs:
      run_adversarial:
        description: Run the expensive mutation and fuzz campaigns.
        type: boolean
        required: false
        default: false
    secrets:
      CODECOV_TOKEN:
        required: false
  # Deep quality runs are requested by the PR classifier or dispatched deliberately.
  # Merge commits reuse matching PR evidence instead of repeating the campaign.
  workflow_dispatch:
    inputs:
      run_adversarial:
        description: Run the expensive mutation and fuzz campaigns.
        type: boolean
        required: false
        default: true
permissions:
  contents: read

concurrency:
  # A new PR head supersedes stale test and mutation campaigns for that PR.
  group: python-tests-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: "3.15"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-ci.txt

      - name: Install test dependencies
        run: python -m pip install -r requirements-ci.txt

      - name: Verify and export source commit
        run: |
          test "$(git rev-parse HEAD)" = "${{ github.event.pull_request.head.sha || github.sha }}"
          echo "SOURCE_COMMIT=$(git rev-parse HEAD)" >> "$GITHUB_ENV"

      - name: Run package unit and integration tests through the contributor targets
        run: >-
          make test-all
          PYTEST_ARGS="--capture=no --cov=django_api_versioning --cov-report=xml:coverage.xml"
          INTEGRATION_PYTEST_ARGS="--cov-append --cov-report=xml:coverage.xml"

      - name: Generate separate line and branch coverage totals
        run: python -m coverage json --pretty-print -o coverage.json

      - name: Preserve combined line and branch coverage evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: combined-package-coverage
          path: |
            coverage.json
            coverage.xml
          if-no-files-found: warn
          retention-days: 7

      - name: Upload coverage reports to Codecov
        if: >-
          github.event_name != 'pull_request' ||
          (github.event.pull_request.head.repo.full_name == github.repository &&
          github.actor != 'dependabot[bot]')
        uses: codecov/codecov-action@0fb7174895f61a3b6b78fc075e0cd60383518dac  # v5.5.5
        with:
          files: ./coverage.xml
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: true

  adversarial:
    name: Adversarial release-readiness campaigns
    if: inputs.run_adversarial == true
    needs: test
    uses: ./.github/workflows/adversarial-testing.yml
    with:
      run_mutation: true

  evidence:
    name: Record reusable deep-quality evidence
    if: >-
      always() &&
      inputs.run_adversarial == true &&
      needs.test.result == 'success' &&
      needs.adversarial.result == 'success'
    needs: [test, adversarial]
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check out the tested source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: "3.12"
      - name: Fingerprint the tested source and effective quality configuration
        run: python scripts/quality_fingerprint.py --output "$RUNNER_TEMP/deep-quality-evidence.json"
      - name: Publish reusable deep-quality evidence
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: deep-quality-evidence
          path: ${{ runner.temp }}/deep-quality-evidence.json
          if-no-files-found: error
          retention-days: 90
