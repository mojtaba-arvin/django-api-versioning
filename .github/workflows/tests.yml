name: Python tests

on:
  workflow_call:
    secrets:
      CODECOV_TOKEN:
        required: false
  # Validate main after pushes and proposed changes through pull requests targeting main.
  # Use workflow_dispatch for deliberate manual checkpoints.
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "django_api_versioning/**"
      - "tests/**"
      - "integration_test_project/**"
      - "scripts/verify_distribution_contents.py"
      - "scripts/smoke_installed_wheel.py"
      - "requirements.txt"
      - "requirements-ci.txt"
      - "pyproject.toml"
      - "pytest.ini"
      - ".github/workflows/tests.yml"
      - "!**/*.md"
permissions:
  contents: read

concurrency:
  group: python-tests-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: "3.15"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-ci.txt

      - name: Install test dependencies
        run: python -m pip install -r requirements-ci.txt

      - name: Verify and export source commit
        run: |
          test "$(git rev-parse HEAD)" = "${{ github.event.pull_request.head.sha || github.sha }}"
          echo "SOURCE_COMMIT=$(git rev-parse HEAD)" >> "$GITHUB_ENV"

      - name: Run package unit tests
        run: >-
          python -m pytest --capture=no --cov=django_api_versioning
          --cov-report=xml:coverage.xml tests

      - name: Run Django integration tests
        run: >-
          python -m pytest --capture=no --cov=django_api_versioning --cov-append
          --cov-report=xml:coverage.xml
          -c integration_test_project/pytest.ini integration_test_project

      - name: Upload coverage reports to Codecov
        if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
        uses: codecov/codecov-action@0fb7174895f61a3b6b78fc075e0cd60383518dac  # v5.5.5
        with:
          files: ./coverage.xml
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: true

  adversarial:
    name: Adversarial release-readiness campaigns
    # Validation branches opt in to the expensive mutation and fuzz campaigns.
    if: github.event_name != 'pull_request' || startsWith(github.event.pull_request.head.ref, 'validation/')
    needs: test
    uses: ./.github/workflows/adversarial-testing.yml
