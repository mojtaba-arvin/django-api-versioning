name: Python tests

on:
  workflow_call:
    inputs:
      run_adversarial:
        description: Run the expensive mutation and fuzz campaigns.
        type: boolean
        required: false
        default: false
    secrets:
      CODECOV_TOKEN:
        required: false
  # Validate main after pushes and proposed changes through pull requests targeting main.
  # Use workflow_dispatch for deliberate manual checkpoints.
  workflow_dispatch:
    inputs:
      run_adversarial:
        description: Run the expensive mutation and fuzz campaigns.
        type: boolean
        required: false
        default: true
  push:
    branches: [main]
    paths:
      - "django_api_versioning/**"
      - "tests/**"
      - "integration_test_project/**"
      - "scripts/verify_distribution_contents.py"
      - "scripts/smoke_installed_wheel.py"
      - "requirements.txt"
      - "requirements-ci.txt"
      - "pytest.ini"
      - "mutmut_config.py"
      - "setup.cfg"
      - "tox.ini"
      - "scripts/check_coverage_thresholds.py"
      - ".github/workflows/tests.yml"
      - ".github/workflows/adversarial-testing.yml"
      - ".github/actions/mutation-shard/action.yml"
      - ".github/workflows/mutation-shard.yml"
      - ".github/workflows/pull-request-gate.yml"
      - ".github/workflows/publish.yml"
      - ".github/workflows/openapi-contract.yml"
      - "!**/*.md"
permissions:
  contents: read

concurrency:
  # Keep validation for distinct commits independent; a new head must not wait
  # behind a stale mutation campaign from an older commit on the same PR.
  group: python-tests-${{ github.event.pull_request.number || github.ref }}-${{ github.sha }}
  # A newer commit supersedes stale tests on the same PR or branch.
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: "3.15"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-ci.txt

      - name: Install test dependencies
        run: python -m pip install -r requirements-ci.txt

      - name: Verify and export source commit
        run: |
          test "$(git rev-parse HEAD)" = "${{ github.event.pull_request.head.sha || github.sha }}"
          echo "SOURCE_COMMIT=$(git rev-parse HEAD)" >> "$GITHUB_ENV"

      - name: Run package unit tests
        run: >-
          python -m pytest --capture=no --cov=django_api_versioning
          --cov-report=xml:coverage.xml tests

      - name: Run Django integration tests
        run: >-
          python -m pytest --capture=no --cov=django_api_versioning --cov-append
          --cov-report=xml:coverage.xml
          -c integration_test_project/pytest.ini integration_test_project

      - name: Generate separate line and branch coverage totals
        run: python -m coverage json --pretty-print -o coverage.json

      - name: Preserve combined line and branch coverage evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: combined-package-coverage
          path: |
            coverage.json
            coverage.xml
          if-no-files-found: warn
          retention-days: 7

      - name: Upload coverage reports to Codecov
        if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
        uses: codecov/codecov-action@0fb7174895f61a3b6b78fc075e0cd60383518dac  # v5.5.5
        with:
          files: ./coverage.xml
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: true

  adversarial:
    name: Adversarial release-readiness campaigns
    if: inputs.run_adversarial == true || github.event_name == 'push'
    needs: test
    uses: ./.github/workflows/adversarial-testing.yml
    with:
      run_mutation: true
