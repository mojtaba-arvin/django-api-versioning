name: Generate website npm lockfile and verify the site

on:
  push:
    branches: [audit/comprehensive-package-review]
    paths:
      - ".github/workflows/website-lock.yml"
      - "website/package.json"

permissions:
  contents: write

concurrency:
  group: website-dependencies-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lock-and-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38  # v6
        with:
          node-version: "22.23.4"
          cache: npm
          cache-dependency-path: website/package-lock.json
      - name: Generate deterministic npm lockfile
        working-directory: website
        run: npm install --package-lock-only --ignore-scripts
      - name: Commit lockfile against the latest branch head
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          # The branch may advance while npm resolves the lockfile. Regenerate
          # from the latest package.json rather than force-pushing stale state.
          for attempt in 1 2 3; do
            git fetch origin "${GITHUB_REF_NAME}"
            remote_sha="$(git rev-parse FETCH_HEAD)"
            current_sha="$(git rev-parse HEAD)"

            if [ "$remote_sha" != "$current_sha" ]; then
              git reset --hard "$remote_sha"
              npm --prefix website install --package-lock-only --ignore-scripts
            fi

            git diff --check
            git add website/package-lock.json

            if git diff --cached --quiet; then
              echo "Lockfile is already up to date."
              exit 0
            fi

            git commit -m "build(site): lock frontend dependencies"
            if git push origin "HEAD:${GITHUB_REF_NAME}"; then
              exit 0
            fi

            echo "Branch advanced during lockfile push attempt $attempt; retrying."
            git reset --hard "$remote_sha"
          done

          echo "Could not publish the lockfile after three concurrent-update retries." >&2
          exit 1
      - name: Install the exact locked dependency tree
        working-directory: website
        run: npm ci
      - name: Audit frontend dependencies
        working-directory: website
        run: npm audit --audit-level=high
      - name: Run frontend unit tests
        working-directory: website
        run: |
          node --check scripts/sync-articles.mjs
          node --check scripts/sync-evidence.mjs
          node --check scripts/check-dist.mjs
          node --check scripts/serve-dist.mjs
          npm test
      - name: Run Astro type and content checks
        working-directory: website
        run: npm run check
      - name: Build and inspect root-hosted artifact
        working-directory: website
        run: |
          npm run build
          npm run test:dist
      - name: Build and inspect GitHub Pages project-site artifact
        working-directory: website
        env:
          PUBLIC_BASE_PATH: /django-api-versioning
        run: |
          npm run build
          npm run test:dist
