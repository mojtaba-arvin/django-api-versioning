name: Publish to PyPI

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  compatibility:
    name: Full Python and Django compatibility matrix
    uses: ./.github/workflows/compatibility.yml
    permissions:
      contents: read

  build:
    name: Build and verify distributions
    needs: compatibility
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: "3.15"

      - name: Verify tag matches the package version
        env:
          TAG_VERSION: ${{ github.ref_name }}
        run: |
          python - <<'PY'
          import os
          import tomllib
          from pathlib import Path

          tag_version = os.environ["TAG_VERSION"].removeprefix("v")
          package_version = tomllib.loads(
              Path("pyproject.toml").read_text(encoding="utf-8")
          )["project"]["version"]
          if tag_version != package_version:
              raise SystemExit(
                  f"Tag version {tag_version!r} does not match "
                  f"pyproject version {package_version!r}."
              )
          print(f"Building django-api-versioning {package_version}")
          PY

      - name: Install runtime and build dependencies
        run: python -m pip install -r requirements.txt -r requirements-build.txt

      - name: Build and validate distributions
        run: |
          python -m build --outdir dist
          python -m twine check --strict dist/*

      - name: Verify the built wheel in isolation
        run: |
          python -m pip install --no-deps dist/*.whl
          cd /tmp
          python "$GITHUB_WORKSPACE/scripts/smoke_installed_wheel.py"

      - name: Verify PyPI artifact boundaries
        run: python scripts/verify_distribution_contents.py dist

      - name: Upload verified distributions
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: python-package-distributions
          path: dist/
          if-no-files-found: error
          retention-days: 1

  publish:
    name: Publish verified distributions to PyPI
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/django-api-versioning
    permissions:
      actions: read
      id-token: write

    steps:
      - name: Download verified distributions
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8.0.2
        with:
          name: python-package-distributions
          path: dist/

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086  # v1.14.3
