name: Publish to PyPI

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  verify-release-ref:
    name: Verify annotated release tag
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check out full history and tags
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Verify annotated tag and main ancestry
        run: |
          set -euo pipefail
          test "$(git cat-file -t "$GITHUB_REF")" = "tag" || {
            echo "Release tags must be annotated." >&2
            exit 1
          }
          tagged_commit="$(git rev-parse "$GITHUB_REF^{commit}")"
          test "$tagged_commit" = "$GITHUB_SHA" || {
            echo "Tag target does not match the triggering commit." >&2
            exit 1
          }
          git fetch origin main --no-tags
          git merge-base --is-ancestor "$tagged_commit" FETCH_HEAD || {
            echo "Release tag must target a commit reachable from main." >&2
            exit 1
          }

  verify-main-compatibility:
    name: Reuse source-matched quality and compatibility evidence
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
    steps:
      - name: Check out the tagged source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: "3.12"

      - name: Require matching deep-quality and full-matrix evidence
        env:
          GH_TOKEN: ${{ github.token }}
        run: python scripts/verify_release_evidence.py --scope all

  openapi-contract:
    name: Versioned OpenAPI consumer contract
    uses: ./.github/workflows/openapi-contract.yml
    permissions:
      contents: read

  build:
    name: Build and verify distributions
    needs: [verify-release-ref, verify-main-compatibility, openapi-contract]
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: "3.15"

      - name: Verify tag matches the package version
        env:
          TAG_VERSION: ${{ github.ref_name }}
        run: |
          python - <<'PY'
          import os
          import tomllib
          from pathlib import Path

          tag_version = os.environ["TAG_VERSION"].removeprefix("v")
          package_version = tomllib.loads(
              Path("pyproject.toml").read_text(encoding="utf-8")
          )["project"]["version"]
          if tag_version != package_version:
              raise SystemExit(
                  f"Tag version {tag_version!r} does not match "
                  f"pyproject version {package_version!r}."
              )
          print(f"Building django-api-versioning {package_version}")
          PY

      - name: Install runtime and build dependencies
        run: python -m pip install -r requirements.txt -r requirements-build.txt

      - name: Build and verify reproducible distributions
        run: |
          python scripts/check_reproducible_build.py --outdir dist
          python -m twine check --strict dist/*

      - name: Verify the built wheel in isolation
        run: |
          python -m pip install --no-deps dist/*.whl
          cd /tmp
          python "$GITHUB_WORKSPACE/scripts/smoke_installed_wheel.py"

      - name: Verify PyPI artifact boundaries
        run: python scripts/verify_distribution_contents.py dist

      - name: Upload verified distributions
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: python-package-distributions
          path: dist/
          if-no-files-found: error
          retention-days: 1

  publish:
    name: Publish verified distributions to PyPI
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/django-api-versioning
    permissions:
      actions: read
      id-token: write

    steps:
      - name: Download verified distributions
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8.0.2
        with:
          name: python-package-distributions
          path: dist/

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086  # v1.14.3


  github-release:
    name: Create GitHub Release after PyPI publication
    needs: publish
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Check out the tagged release
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
        with:
          ref: ${{ github.ref }}
          persist-credentials: false

      - name: Extract the version's changelog entry
        env:
          RELEASE_TAG: ${{ github.ref_name }}
          NOTES_FILE: ${{ runner.temp }}/release-notes.md
        run: |
          python - <<'PY'
          import os
          import re
          from pathlib import Path

          tag = os.environ["RELEASE_TAG"]
          version = tag.removeprefix("v")
          lines = Path("CHANGELOG.md").read_text(encoding="utf-8").splitlines()
          heading = re.compile(rf"^## \[{re.escape(version)}\](?: - .*)?$")
          start = next((i for i, line in enumerate(lines) if heading.match(line)), None)
          if start is None:
              raise SystemExit(f"No dated CHANGELOG.md section found for {version}.")
          end = next(
              (i for i in range(start + 1, len(lines)) if lines[i].startswith("## ")),
              len(lines),
          )
          notes = "\n".join(lines[start + 1:end]).strip()
          if not notes:
              raise SystemExit(f"CHANGELOG.md section for {version} is empty.")
          Path(os.environ["NOTES_FILE"]).write_text(notes + "\n", encoding="utf-8")
          PY

      - name: Create the GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
          NOTES_FILE: ${{ runner.temp }}/release-notes.md
        run: |
          if gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "GitHub Release $RELEASE_TAG already exists; leaving it unchanged."
          else
            gh release create "$RELEASE_TAG" \
              --repo "$GITHUB_REPOSITORY" \
              --verify-tag \
              --title "django-api-versioning ${RELEASE_TAG#v}" \
              --notes-file "$NOTES_FILE"
          fi
