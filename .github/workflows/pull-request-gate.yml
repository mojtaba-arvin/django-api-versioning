name: Pull request gate

on:
  pull_request:
    types: [opened, edited, reopened, synchronize, ready_for_review]
    branches: [main]

permissions:
  actions: read
  contents: read
  pull-requests: read

concurrency:
  group: pull-request-gate-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  changes:
    name: Classify changed paths
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      python: ${{ steps.classify.outputs.python }}
      deep: ${{ steps.classify.outputs.deep }}
      metadata: ${{ steps.classify.outputs.metadata }}
      compatibility: ${{ steps.classify.outputs.compatibility }}
      compatibility_full: ${{ steps.classify.outputs.compatibility_full }}
      package: ${{ steps.classify.outputs.package }}
      website: ${{ steps.classify.outputs.website }}
      agent: ${{ steps.classify.outputs.agent }}
      dependency: ${{ steps.classify.outputs.dependency }}
      openapi: ${{ steps.classify.outputs.openapi }}
    steps:
      - name: Fetch changed paths from the pull request
        env:
          GH_TOKEN: ${{ github.token }}
          GH_PROMPT_DISABLED: "1"
        run: |
          gh api --paginate \
            "repos/${GITHUB_REPOSITORY}/pulls/${{ github.event.pull_request.number }}/files?per_page=100" \
            --jq '.[].filename' > "$RUNNER_TEMP/changed-files.txt"
      - name: Check out the pull request head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: "3.12"
      - name: Validate the squash-merge commit title
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: python scripts/check_commit_message.py --message "$PR_TITLE"
      - name: Validate every commit subject in the pull request
        env:
          GH_TOKEN: ${{ github.token }}
          GH_PROMPT_DISABLED: "1"
        run: |
          gh api --paginate \
            "repos/${GITHUB_REPOSITORY}/pulls/${{ github.event.pull_request.number }}/commits?per_page=100" \
            --jq '.[].commit.message | split("\n")[0]' > "$RUNNER_TEMP/commit-subjects.txt"
          python scripts/check_commit_message.py --subjects-file "$RUNNER_TEMP/commit-subjects.txt"
      - name: Validate commit authors and co-author trailers
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: python scripts/check_commit_identity.py
      - name: Classify checks required by the changed files
        id: classify
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: python scripts/classify_pr_changes.py "$RUNNER_TEMP/changed-files.txt" "$GITHUB_OUTPUT" "$BASE_SHA"

  unit-tests:
    name: Python unit and integration tests
    needs: changes
    if: needs.changes.outputs.python == 'true'
    uses: ./.github/workflows/tests.yml
    with:
      run_adversarial: ${{ needs.changes.outputs.deep == 'true' }}
    secrets:
      CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
    permissions:
      contents: read

  compatibility:
    name: Python/Django compatibility matrix
    needs: changes
    if: needs.changes.outputs.compatibility == 'true'
    uses: ./.github/workflows/compatibility.yml
    with:
      scope: ${{ needs.changes.outputs.compatibility_full == 'true' && 'full' || 'pull-request' }}
    permissions:
      contents: read

  package-artifacts:
    name: Build and verify Python distributions
    needs: changes
    if: needs.changes.outputs.package == 'true'
    uses: ./.github/workflows/package-artifacts.yml
    permissions:
      contents: read

  website:
    name: Website build and static verification
    needs: changes
    if: needs.changes.outputs.website == 'true'
    uses: ./.github/workflows/website-data-preflight.yml
    permissions:
      contents: read

  agent-tooling:
    name: Agent and workflow policy validation
    needs: changes
    if: needs.changes.outputs.agent == 'true'
    uses: ./.github/workflows/agent-tooling.yml
    permissions:
      contents: read

  openapi-contract:
    name: Versioned OpenAPI consumer contract
    needs: changes
    if: needs.changes.outputs.openapi == 'true'
    uses: ./.github/workflows/openapi-contract.yml
    permissions:
      contents: read


  release-metadata:
    name: Validate release version and lockfile
    needs: changes
    if: needs.changes.outputs.metadata == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Check out the pull request head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: "3.12"
      - name: Install uv
        run: python -m pip install uv
      - name: Verify lockfile matches project metadata
        run: uv lock --check

  dependency-review:
    name: Dependency review
    needs: changes
    if: needs.changes.outputs.dependency == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: read
    steps:
      - name: Review dependency changes
        uses: actions/dependency-review-action@bbc44d14a204704ccc493733616cd1e93a0321ec  # v5.0.1
        with:
          fail-on-severity: high
          comment-summary-in-pr: true

  gate:
    name: PR gate
    if: always()
    needs:
      - changes
      - unit-tests
      - compatibility
      - package-artifacts
      - website
      - agent-tooling
      - openapi-contract
      - dependency-review
      - release-metadata
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require every applicable check to succeed
        env:
          NEEDS_JSON: ${{ toJSON(needs) }}
        run: |
          python - <<'PY'
          import json
          import os
          import sys

          needs = json.loads(os.environ["NEEDS_JSON"])
          changes = needs["changes"]
          if changes["result"] != "success":
              raise SystemExit("Path classification did not succeed.")

          expected = {
              "unit-tests": "python",
              "compatibility": "compatibility",
              "package-artifacts": "package",
              "website": "website",
              "agent-tooling": "agent",
              "openapi-contract": "openapi",
              "dependency-review": "dependency",
              "release-metadata": "metadata",
          }
          failures = []
          for job, output in expected.items():
              should_run = changes["outputs"].get(output) == "true"
              result = needs[job]["result"]
              if should_run and result != "success":
                  failures.append(f"{job}: expected success, got {result}")
              elif not should_run and result not in {"success", "skipped"}:
                  failures.append(f"{job}: unexpected result {result}")

          if failures:
              print("\\n".join(failures), file=sys.stderr)
              raise SystemExit(1)

          print("All applicable PR checks passed; the reusable Python workflow owns its optional adversarial campaign.")
          PY

      - name: Check out source for evidence verification
        if: >-
          success() &&
          (
            needs.changes.outputs.deep == 'true' ||
            needs.changes.outputs.openapi == 'true' ||
            needs.changes.outputs.compatibility_full == 'true'
          )
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false

      - name: Set up Python for evidence verification
        if: >-
          success() &&
          (
            needs.changes.outputs.deep == 'true' ||
            needs.changes.outputs.openapi == 'true' ||
            needs.changes.outputs.compatibility_full == 'true'
          )
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: "3.12"

      - name: Verify Deep Quality evidence artifact
        if: success() && needs.changes.outputs.deep == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: python scripts/verify_release_evidence.py --scope deep --allow-current-run

      - name: Verify OpenAPI contract evidence artifact
        if: success() && needs.changes.outputs.openapi == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: python scripts/verify_release_evidence.py --scope openapi --allow-current-run

      - name: Verify full compatibility evidence artifact
        if: success() && needs.changes.outputs.compatibility_full == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: python scripts/verify_release_evidence.py --scope compatibility --allow-current-run
