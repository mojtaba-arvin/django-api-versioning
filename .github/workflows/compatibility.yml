name: Compatibility matrix

on:
  # Standard GitHub-hosted runners are free for public repositories.
  # Run the complete compatibility matrix for package/test changes and on PR review.
  push:
    branches:
      - main
      - audit/comprehensive-package-review
    paths:
      - "django_api_versioning/**"
      - "tests/**"
      - "integration_test_project/**"
      - "pyproject.toml"
      - "tox.ini"
      - "requirements*.txt"
      - "pytest.ini"
      - "scripts/**"
      - ".github/workflows/compatibility.yml"
      - ".github/workflows/publish.yml"
  pull_request:
    types: [opened, reopened, ready_for_review]
    paths:
      - "django_api_versioning/**"
      - "tests/**"
      - "integration_test_project/**"
      - "pyproject.toml"
      - "tox.ini"
      - "requirements*.txt"
      - "pytest.ini"
      - "scripts/**"
      - ".github/workflows/compatibility.yml"
      - ".github/workflows/publish.yml"
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: compatibility-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tox:
    name: ${{ matrix.env }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - env: py310-django42
            python: "3.10"
          - env: py311-django42
            python: "3.11"
          - env: py312-django42
            python: "3.12"
          - env: py310-django52
            python: "3.10"
          - env: py311-django52
            python: "3.11"
          - env: py312-django52
            python: "3.12"
          - env: py313-django52
            python: "3.13"
          - env: py314-django52
            python: "3.14"
          - env: py312-django60
            python: "3.12"
          - env: py313-django60
            python: "3.13"
          - env: py314-django60
            python: "3.14"
          - env: py312-django61
            python: "3.12"
          - env: py313-django61
            python: "3.13"
          - env: py314-django61
            python: "3.14"
          - env: py315-django61
            python: "3.15"
          - env: lint
            python: "3.15"

    steps:
      - name: Checkout source
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}

      - name: Cache uv environments
        uses: actions/cache@v6
        with:
          path: ~/.cache/uv
          key: uv-${{ runner.os }}-${{ matrix.env }}-${{ hashFiles('tox.ini', 'pyproject.toml') }}
          restore-keys: |
            uv-${{ runner.os }}-${{ matrix.env }}-

      - name: Install tox and tox-uv
        run: python -m pip install tox tox-uv

      - name: Run compatibility environment
        run: tox run -e ${{ matrix.env }}
