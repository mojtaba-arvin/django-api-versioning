name: Compatibility matrix

on:
  # PRs use boundary smoke checks unless dependency or matrix inputs require the full matrix.
  # Runtime changes receive the full matrix once after merge to main.
  push:
    branches:
      - main
    paths:
      - "django_api_versioning/**"
      - "tests/**"
      - "integration_test_project/**"
  workflow_dispatch:
    inputs:
      scope:
        description: "Select the full matrix or the bounded pull-request smoke matrix."
        required: false
        type: choice
        options:
          - full
          - pull-request
        default: full
  workflow_call:
    inputs:
      scope:
        description: "Full matrix by default; pull-request selects boundary environments only."
        required: false
        type: string
        default: full

permissions:
  contents: read

concurrency:
  group: compatibility-${{ github.workflow }}-${{ github.ref }}
  # Keep in-flight release checks running; cancelled matrix jobs must not be mistaken for completed validation.
  cancel-in-progress: false

jobs:
  platform-smoke:
    name: ${{ matrix.os }} / Python 3.12 / Django 5.2
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os:
          - windows-latest
          - macos-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: "3.12"

      - name: Install tox and tox-uv
        run: python -m pip install tox tox-uv

      - name: Run unit and integration tests
        run: tox run -e py312-django52

  validate-matrix:
    name: Verify tox and workflow environments
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      - name: Validate workflow and Dependabot YAML syntax
        run: |
          ruby -e 'require "yaml"; Dir.glob(".github/**/*.yml").sort.each { |file| YAML.safe_load_file(file, aliases: true); puts "valid YAML: #{file}" }'

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: "3.15"

      - name: Install tox configuration tools
        run: python -m pip install tox tox-uv

      - name: Verify workflow matrix matches tox.ini
        run: python scripts/check_tox_workflow_matrix.py

      - name: Verify uv.lock matches pyproject.toml
        run: uv lock --check

  tox:
    needs: validate-matrix
    if: inputs.scope != 'pull-request'
    name: ${{ matrix.env }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      # Reserve runner capacity for the package tests and adversarial checks that
      # can run alongside this matrix on GitHub Free (20 concurrent jobs).
      max-parallel: 10
      matrix:
        include:
          - env: py310-django42
            python: "3.10"
          - env: py311-django42
            python: "3.11"
          - env: py312-django42
            python: "3.12"
          - env: py310-django52
            python: "3.10"
          - env: py311-django52
            python: "3.11"
          - env: py312-django52
            python: "3.12"
          - env: py313-django52
            python: "3.13"
          - env: py314-django52
            python: "3.14"
          - env: py312-django60
            python: "3.12"
          - env: py313-django60
            python: "3.13"
          - env: py314-django60
            python: "3.14"
          - env: py312-django61
            python: "3.12"
          - env: py313-django61
            python: "3.13"
          - env: py314-django61
            python: "3.14"
          - env: py315-django61
            python: "3.15"
          - env: lint
            python: "3.15"

    steps:
      - name: Checkout source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: ${{ matrix.python }}

      - name: Cache uv environments
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6
        with:
          path: ~/.cache/uv
          key: uv-${{ runner.os }}-${{ matrix.env }}-${{ hashFiles('tox.ini', 'pyproject.toml') }}
          restore-keys: |
            uv-${{ runner.os }}-${{ matrix.env }}-

      - name: Install tox and tox-uv
        run: python -m pip install tox tox-uv

      - name: Run compatibility environment
        run: tox run -e ${{ matrix.env }}

  tox-pr-smoke:
    needs: validate-matrix
    name: PR smoke / ${{ matrix.env }}
    if: inputs.scope == 'pull-request'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - env: py310-django42
            python: "3.10"
          - env: py315-django61
            python: "3.15"
          - env: lint
            python: "3.15"

    steps:
      - name: Checkout source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python }}

      - name: Cache uv environments
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ~/.cache/uv
          key: uv-${{ runner.os }}-${{ matrix.env }}-${{ hashFiles('tox.ini', 'pyproject.toml') }}
          restore-keys: |
            uv-${{ runner.os }}-${{ matrix.env }}-

      - name: Install tox and tox-uv
        run: python -m pip install tox tox-uv

      - name: Run compatibility smoke environment
        run: tox run -e ${{ matrix.env }}

  compatibility-evidence:
    name: Record reusable full-matrix evidence
    if: inputs.scope != 'pull-request'
    needs: [validate-matrix, platform-smoke, tox]
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check out the validated source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: "3.12"
      - name: Fingerprint compatibility inputs
        run: python scripts/quality_fingerprint.py --output "$RUNNER_TEMP/compatibility-evidence.json"
      - name: Publish reusable compatibility evidence
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: compatibility-evidence
          path: ${{ runner.temp }}/compatibility-evidence.json
          if-no-files-found: error
          retention-days: 90
