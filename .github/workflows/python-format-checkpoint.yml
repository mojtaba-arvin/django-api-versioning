name: Python format and lint checkpoint

on:
  push:
    branches: [audit/comprehensive-package-review]
    paths:
      - ".github/workflows/python-format-checkpoint.yml"

permissions:
  contents: write

jobs:
  format-and-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: "3.15"
      - name: Install formatters and tox
        run: python -m pip install black isort tox tox-uv
      - name: Format Python sources
        run: |
          black .
          isort .
      - name: Verify lint environment
        run: tox run -e lint
      - name: Commit formatter changes
        run: |
          git diff --check
          if ! git diff --quiet; then
            git config user.name "Mojtaba Arvin"
            git config user.email "m.arvin@live.com"
            git add -u
            git commit -m "style: format migration command regression tests"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi
