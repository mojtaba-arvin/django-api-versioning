repos:
  - repo: local
    hooks:
      - id: conventional-commit-message
        name: Enforce Conventional Commit message
        entry: python scripts/check_commit_message.py
        language: system
        stages: [commit-msg]
        pass_filenames: true
        always_run: true


  # Black for code formatting
  - repo: https://github.com/psf/black
    rev: 26.10.0
    hooks:
      - id: black
        files: \.py$

  # isort for sorting imports
  - repo: https://github.com/pycqa/isort
    rev: 9.0.2
    hooks:
      - id: isort
        args: [--profile=black] # follow Black for line length
        files: \.py$

  # Flake8 for linting
  - repo: https://github.com/PyCQA/flake8
    rev: 7.4.1
    hooks:
      - id: flake8
        additional_dependencies:
          - Flake8-pyproject>=1.2.4
        args: [--max-line-length=88] # Flake default is 79, but Black is 88
        files: \.py$

  # mypy for type checking
  - repo: https://github.com/pre-commit/mirrors-mypy
    rev: v2.4.0
    hooks:
      - id: mypy
        files: \.py$

  - repo: local
    hooks:
      - id: agent-config-validate
        name: Validate coding-agent configuration
        entry: python scripts/agent.py validate
        language: system
        pass_filenames: false
        files: ^(AGENTS\.md|CLAUDE\.md|\.agents/|\.claude/skills/|\.github/copilot-instructions\.md|\.github/skills/|scripts/agent\.py|scripts/agent_tests/)
      - id: tox-lint-before-push
        name: Run repository lint before pushing Python changes
        entry: tox run -e lint
        language: system
        pass_filenames: false
        stages: [pre-push]
        files: ^(django_api_versioning|tests|integration_test_project|scripts)/.*\.py$|^(pyproject\.toml|tox\.ini)$
