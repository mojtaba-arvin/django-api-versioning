[build-system]
requires = ["setuptools>=77.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "django-api-versioning"
version = "1.4.1"
description = "Version-aware endpoint routing and request-version negotiation for Django and Django REST Framework."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [
    { name = "Mojtaba Arvin", email = "ArvinDevDay@gmail.com" },
]
keywords = [
    "django api versioning",
    "django rest framework api versioning",
    "drf versioning",
    "request version negotiation",
    "url path api versioning",
    "header api versioning",
    "query api versioning",
    "hostname api versioning",
    "versioned url routing",
    "endpoint registration",
    "version-specific django views",
    "django-api-versioning",
]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: 3.15",
    "Framework :: Django",
    "Framework :: Django :: 4.2",
    "Framework :: Django :: 5.2",
    "Framework :: Django :: 6.0",
    "Framework :: Django :: 6.1",
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Topic :: Internet :: WWW/HTTP",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Typing :: Typed",
]
dependencies = [
    "Django>=4.2",
]

[project.optional-dependencies]
dev = [
    "black>=26.10.1",
    "flake8>=7.4.1",
    "isort>=9.0.2",
    "mypy>=2.4.0",
    "pytest>=9.2.0",
    "pytest-django>=4.14.0",
    "pytest-cov>=7.1.0",
    "pre-commit>=4.7.0; python_version >= '3.11'",
    "twine>=7.0.0",
    "build>=1.6.1",
    "djangorestframework>=3.18",
    "tomli>=2.5.0; python_version < '3.11'",
]

[project.urls]
Homepage = "https://mojtaba-arvin.github.io/django-api-versioning/"
Documentation = "https://mojtaba-arvin.github.io/django-api-versioning/reference/"
Source = "https://github.com/mojtaba-arvin/django-api-versioning"
Issues = "https://github.com/mojtaba-arvin/django-api-versioning/issues"
Changelog = "https://github.com/mojtaba-arvin/django-api-versioning/blob/main/CHANGELOG.md"
Security = "https://github.com/mojtaba-arvin/django-api-versioning/blob/main/SECURITY.md"

[tool.setuptools.packages.find]
# Only the importable distribution package belongs in the wheel.
# Tests, integration projects, and the documentation website are repository assets.
include = ["django_api_versioning*"]
exclude = [
    "tests",
    "tests.*",
    "integration_test_project",
    "integration_test_project.*",
]

[tool.setuptools.package-data]
django_api_versioning = ["py.typed"]

[tool.black]
line-length = 88
target-version = ["py310"]

[tool.isort]
profile = "black"

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
ignore_missing_imports = true

[tool.flake8]
max-line-length = 88
ignore = ["E203", "E266", "E501", "W503"]
max-complexity = 18
select = ["B", "C", "E", "F", "W", "T4", "B9"]
exclude = [
    ".git",
    "__pycache__",
    "build",
    "dist",
    ".tox",
    ".venv",
    "venv",
    ".eggs",
    "*.egg",
]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "tests.settings"
python_files = ["test_*.py"]
testpaths = ["tests"]
addopts = "-ra --cov=django_api_versioning --cov-report=term-missing"

[tool.coverage.run]
branch = true
source = ["django_api_versioning"]
omit = ["*/tests/*", "*/migrations/*"]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "if __name__ == .__main__.:",
    "raise NotImplementedError",
    "if TYPE_CHECKING:",
]

