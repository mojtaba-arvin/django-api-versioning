[build-system]
requires = ["setuptools>=84.2.1"]
build-backend = "setuptools.build_meta"

[project]
name = "django-api-versioning"
version = "0.2.0"
description = "Django API versioning for Django and Django REST Framework (DRF), with decorator-based endpoint versioning, automatic URL registration, backward compatibility, and forward endpoint inheritance."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [
    { name = "Mojtaba Arvin", email = "ArvinDevDay@gmail.com" },
]
keywords = [
    "django api versioning",
    "api versioning",
    "django",
    "django framework",
    "django rest framework",
    "drf",
    "url-based api versioning",
    "api versioning decorator",
    "versioned api endpoints",
    "automatic url registration",
    "backward compatibility",
    "endpoint inheritance",
]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: 3.15",
    "Framework :: Django",
    "Framework :: Django :: 5.2",
    "Framework :: Django :: 6.0",
    "Framework :: Django :: 6.1",
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Topic :: Internet :: WWW/HTTP",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Typing :: Typed",
]
dependencies = [
    "Django>=5.2",
]

[project.optional-dependencies]
dev = [
    "black>=26.10.1",
    "flake8>=7.4.1",
    "isort>=9.0.2",
    "mypy>=2.4.0",
    "pytest>=9.2.0",
    "pytest-django>=4.14.0",
    "pytest-cov>=7.1.0",
    "pre-commit>=4.6.2",
    "twine>=7.0.0",
    "build>=1.6.1",
]

[project.urls]
Source = "https://github.com/mojtaba-arvin/django-api-versioning"
Issues = "https://github.com/mojtaba-arvin/django-api-versioning/issues"
Documentation = "https://github.com/mojtaba-arvin/django-api-versioning#readme"
Changelog = "https://github.com/mojtaba-arvin/django-api-versioning/blob/main/CHANGELOG.md"

[tool.setuptools.packages.find]
exclude = ["tests", "tests.*"]

[tool.setuptools.package-data]
django_api_versioning = ["py.typed"]

[tool.black]
line-length = 88
target-version = ["py310"]

[tool.isort]
profile = "black"

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
ignore_missing_imports = true

[tool.flake8]
max-line-length = 88
ignore = ["E203", "E266", "E501", "W503"]
max-complexity = 18
select = ["B", "C", "E", "F", "W", "T4", "B9"]
exclude = [
    ".git",
    "__pycache__",
    "build",
    "dist",
    ".tox",
    ".venv",
    "venv",
    ".eggs",
    "*.egg",
]
