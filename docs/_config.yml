# Jekyll configuration for GitHub Pages
# This is a minimal configuration for a static landing page

title: Django API Versioning
description: Professional API versioning for Django and Django REST Framework
url: "https://mojtaba-arvin.github.io"
baseurl: "/django-api-versioning"

# GitHub Pages settings
remote_theme: null
plugins: []

# Disable Jekyll processing for index.html
markdown: CommonMark
include:
  - .nojekyll

# Build settings
exclude:
  - Gemfile
  - Gemfile.lock
  - node_modules
  - vendor
  - .git
  - .github
  - tests
  - integration_test_project
  - django_api_versioning
  - "*.egg-info"
  - dist
  - build
