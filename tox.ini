[tox]
requires = tox-uv
envlist =
    py{310,311,312}-django42
    py{310,311,312,313,314}-django52
    py{312,313,314}-django60
    py{312,313,314,315}-django61
    lint

[testenv:lint]
skip_install = true
deps =
    flake8>=7.4.1
    Flake8-pyproject>=1.2.4
    black
    isort
commands =
    flake8 django_api_versioning tests integration_test_project scripts
    black --diff .
    black --check .
    isort --check-only --diff .

[testenv]
setenv =
    COVERAGE_FILE = .coverage.{envname}
deps =
    django42: Django>=4.2,<4.3
    django52: Django>=5.2,<5.3
    django60: Django>=6.0,<6.1
    django61: Django>=6.1,<6.2
    pytest
    pytest-django
    pytest-cov
    django42: djangorestframework>=3.17.2,<3.18
    django52: djangorestframework>=3.18,<3.19
    django60: djangorestframework>=3.18,<3.19
    django61: djangorestframework>=3.18,<3.19
    tomli>=2.5.0; python_version < "3.11"
commands =
    python -m pytest tests --maxfail=1 --disable-warnings -q
    python -m pytest integration_test_project --maxfail=1 --disable-warnings -q
