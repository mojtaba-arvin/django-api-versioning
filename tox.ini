[tox]
envlist =
    py{310,311,312,313,314}-django52
    py{312,313,314}-django60
    py{312,313,314,315}-django61
    lint

[testenv:lint]
skip_install = true
deps =
    flake8>=7.4.1
    Flake8-pyproject>=1.2.4
    black
    isort
commands =
    flake8 django_api_versioning tests
    black --check .
    isort --check-only .

[testenv]
deps =
    django52: Django>=5.2,<5.3
    django60: Django>=6.0,<6.1
    django61: Django>=6.1,<6.2
    pytest
    pytest-django
    pytest-cov
commands =
    python -m pytest --maxfail=1 --disable-warnings -q
